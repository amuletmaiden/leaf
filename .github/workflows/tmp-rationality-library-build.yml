name: Temporary Rationality Library Build
on:
  pull_request:
    paths: ['.github/rationality-build-trigger']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: pandoc/actions/setup@v1
      - run: git clone --depth 1 --branch master_lite https://github.com/jrincayc/rationality-ai-zombies.git src
      - name: Normalize 2015-derived TeX for Pandoc
        run: |
          python - <<'PY'
          from pathlib import Path
          def matching_close(s, start):
              depth = 0
              for i in range(start, len(s)):
                  if s[i] == '{' and (i == 0 or s[i-1] != '\\'):
                      depth += 1
                  elif s[i] == '}' and (i == 0 or s[i-1] != '\\'):
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError('unbalanced group')
          for p in Path('src').glob('*.tex'):
              s = p.read_text(encoding='utf-8')
              marker = r'\footnote{Edit 2018:'
              while marker in s:
                  start = s.index(marker)
                  brace = s.index('{', start)
                  end = matching_close(s, brace)
                  s = s[:start] + s[end+1:]
              # Pandoc's LaTeX reader dislikes arbitrary paragraph-spanning
              # TeX groups emitted by the EPUB->TeX conversion. Remove only
              # groups whose opening brace is the sole token on its line,
              # together with that exact brace's matching closer.
              while True:
                  lines = s.splitlines(keepends=True)
                  pos = 0
                  opener = None
                  for line in lines:
                      if line.strip() == '{':
                          opener = pos + line.index('{')
                          break
                      pos += len(line)
                  if opener is None:
                      break
                  closer = matching_close(s, opener)
                  s = s[:closer] + s[closer+1:]
                  s = s[:opener] + s[opener+1:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Build EPUB
        run: |
          pandoc src/front.tex src/map_and_territory.tex src/change_mind.tex src/machine_in_ghost.tex src/mere_reality.tex src/mere_goodness.tex src/becoming_stronger.tex --from=latex --to=epub3 --resource-path=src --metadata='title:Rationality: From AI to Zombies' --metadata='author:Eliezer Yudkowsky' --metadata='date:2015' --toc -o 'Rationality From AI to Zombies.epub'
          unzip -t 'Rationality From AI to Zombies.epub'
      - uses: actions/upload-artifact@v4
        with:
          name: rationality-library-epub
          path: Rationality From AI to Zombies.epub
          retention-days: 1
