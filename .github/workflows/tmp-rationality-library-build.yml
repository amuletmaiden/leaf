name: Temporary Rationality Library Build
on:
  pull_request:
    paths: ['.github/rationality-build-trigger']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download published EPUB
        run: |
          python - <<'PY'
          import html, re, urllib.parse, urllib.request, sys
          page = 'https://intelligence.org/rationality-ai-zombies/'
          req = urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          data = urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          hrefs = [html.unescape(x) for x in re.findall(r'href=["\']([^"\']+)["\']', data, re.I)]
          links = [urllib.parse.urljoin(page, x) for x in hrefs]
          epub = [x for x in links if '.epub' in x.lower()]
          print('EPUB candidates:', *epub, sep='\n')
          if not epub:
              print('Relevant download links:')
              for x in links:
                  if any(k in x.lower() for k in ('gumroad','ebook','download','rationality')):
                      print(x)
              sys.exit('No direct EPUB link found')
          out = 'Rationality From AI to Zombies.epub'
          req = urllib.request.Request(epub[0], headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=60) as r, open(out,'wb') as f:
              f.write(r.read())
          PY
          test $(stat -c%s 'Rationality From AI to Zombies.epub') -gt 100000
          unzip -t 'Rationality From AI to Zombies.epub'
      - uses: actions/upload-artifact@v4
        with:
          name: rationality-library-epub
          path: Rationality From AI to Zombies.epub
          retention-days: 1
