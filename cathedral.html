<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>leaf · cathedral mirror</title>
<style>
:root{--r:#ff0000;--g:#00ff00;--p:#ff00ff;--b:#00c8ff;--y:#ffff00;--ice:#c8f7ff;--ink:#d9ecf4}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--ink);font-family:"Courier New",monospace}
#source{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;filter:brightness(1.03) contrast(1.08) saturate(1.12)}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bloom{z-index:5;mix-blend-mode:screen}
#doctrine{z-index:6}
#grain{position:fixed;inset:-20%;z-index:7;pointer-events:none;opacity:.105;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");animation:grain .24s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(2%,2%)}100%{transform:translate(-1%,-1%)}}
#name{position:fixed;z-index:10;top:18px;left:50%;transform:translateX(-50%);pointer-events:none;font-size:10px;letter-spacing:.34em;text-transform:uppercase;opacity:.55;text-shadow:0 0 14px currentColor;transition:opacity 1.2s}
#name.sleep{opacity:.08}
#tools{position:fixed;right:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:4px;padding:5px;border:1px solid rgba(130,210,255,.11);background:rgba(0,3,6,.68);backdrop-filter:blur(9px);box-shadow:0 8px 35px rgba(0,0,0,.48);opacity:.16;transition:opacity .18s}
#tools:hover,#tools:focus-within{opacity:.92}
#tools a,#tools button{appearance:none;border:0;background:transparent;color:#91aab5;text-decoration:none;padding:6px 8px;font:10px "Courier New",monospace;letter-spacing:.08em;cursor:pointer}
#tools a:hover,#tools button:hover{color:#fff;text-shadow:0 0 8px currentColor}
#tools button[data-on="0"]{text-decoration:line-through;color:#52636c}
#mark{color:var(--ice)!important}
#hint{position:fixed;z-index:20;left:14px;bottom:14px;max-width:360px;padding:8px 10px;border-left:1px solid rgba(0,200,255,.24);background:linear-gradient(90deg,rgba(0,5,8,.72),transparent);font-size:10px;line-height:1.45;color:#637883;opacity:0;pointer-events:none;transition:opacity .3s}
#hint.show{opacity:.78}
#failure{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#000;color:#7b929d;font-size:12px;letter-spacing:.08em;text-align:center;padding:30px}
</style>
</head>
<body>
<iframe id="source" src="index.html" title="Leaf"></iframe>
<canvas id="bloom" class="fx"></canvas>
<canvas id="doctrine" class="fx"></canvas>
<div id="grain"></div>
<div id="name"><span style="color:var(--b)">cathe</span><span style="color:var(--p)">dral</span> <span style="color:var(--ice)">mirror</span></div>
<nav id="tools" aria-label="Cathedral laboratory controls">
<a href="index.html">main</a><a href="council.html">council</a>
<button id="veil" type="button" title="Compare with the unaltered world">veil</button>
<button id="architecture" type="button">arches</button>
<button id="optics" type="button">optics</button>
<button id="mark" type="button" title="Keep this passage in Chronicle Loom">mark</button>
</nav>
<div id="hint">\\ veil · B optics · A arches · G grain · M mark passage</div>
<div id="failure">The mirror could not see the world.<br>Open the main page once, then return.</div>
<script src="leaf-cathedral.js"></script>
</body>
</html>
