<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2300c8ff'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff0033'/%3E%3C/svg%3E">
<style>
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:"Courier New",monospace}
#world{display:block;width:100vw;height:100vh}
#title{position:fixed;top:12px;left:16px;font-size:11px;color:#3a3a3a;letter-spacing:2px;pointer-events:none}
#tally{position:fixed;top:12px;right:16px;font-size:11px;color:#555;text-align:right;line-height:1.7;pointer-events:none}
</style>
</head>
<body>
<canvas id="world" width="1280" height="720"></canvas>
<div id="tally"><span style="color:#68f">law 3</span><br><span style="color:#4dd">ice 0</span><br><span style="color:#f74">vess 0</span><br><span style="color:#fd6">ahika 0</span><br><span style="color:#d5d">gyres 1</span><br><span style="color:#d66">hearts 1</span><br><span style="color:#ca2">stars 0</span></div>
<script>
/* ===========================================================================
   LEAF -- a metaphysics simulator built on kata
   ===========================================================================
   NOTES FOR WHOEVER PICKS THIS UP NEXT (including a later me)

   WHAT THIS IS
   One self-contained page. No build step, no dependencies, no network. Open it
   in a browser and it runs; it is meant to be left running for hours, and
   almost every rate in it is tuned for that rather than for a demo.

   HOW IT IS ARRANGED
   The script is sectioned by the four kata, in order, and each section owns its
   own state, update and draw:
     HEART  -- the self, the fires, the daughters
     LOVE   -- green, the gaze, the ice dress
     TEMPLE -- the law lattice, its growth, its embers and goddesses
     POWER  -- the gyres, rot, the turning
   then: contacts (what happens where two of them touch), the ordered spellings,
   the arrivals (bride, aggressor), stars and the fall, the main frame, and
   finally save/restore and the terminal.

   THE ONE RULE ABOUT COLOUR
   Colour is semantics here, not decoration, and it is load-bearing everywhere.
   Do not "clean up" a hue, do not collapse two colours that look similar, and
   do not make anything monochrome. The blues in particular are not
   interchangeable: law and ice are different substances and are drawn as such.

   INVARIANTS -- things that will look like bugs and are not
   - Small texture (sparks, motes, glints) is deliberately NOT scaled by pace.
     Only arrivals, growth and deaths are stretched. See the PACE block.
   - The record layer P is never cleared except on reset. Accumulated paint IS
     the world's memory; it is not a cache and must not be treated as one.
   - Backing layers only ever grow (ensureBacking). Shrinking a window must not
     destroy detail painted at a larger size.
   - Nothing is spawned by name. Every figure is a CONDITION the world enters.
     If you find yourself writing spawnX(), stop and write the condition.
   - Compounds are mortal by construction and decompose into their own terms,
     never into something new. See decompose().

   WHERE TO TUNE
   const TUNE, immediately after the PACE block. Everything a successor is
   likely to want to move is there and nothing there is load-bearing.

   OPEN, NOT YET DONE  (in rough order of appetite)
   - The four forces. HEART/strong, LOVE/electromagnetism, POWER/weak,
     TEMPLE/gravity, resolved in one integrator so they compose instead of
     taking turns. The starfall is now integrated; nothing else is yet.
   - Law as an infectious field: a local lawfulness scalar that discretises
     what it touches (snapping, periodicity, scheduled rather than
     probabilistic decay) -- rules and clicky bits, NOT tidiness.
   - Goddess intelligence as a ladder fed by accumulated law skirts:
     impulse, tropism, memory, anticipation, legislation.
   - The star-devourer: a retrograde figure who runs star -> gyre -> ice
     against everyone else. Her signature is that processes near her un-happen.
   - Progress as shape rather than number: a tree that grows a branch the first
     time two colours interact in a new way; spells as fruit on it.
   - Continents of green over the law lattice, with the radiation field kept
     underneath rather than replaced.
   - Bloom, occlusion, and light that tints what stands in it.
   - Points in drawTemple still build a fillStyle string each, each frame
     (~700/frame). The links no longer do; batch the points the same way.
   - The canvas is sized in CSS pixels and ignores devicePixelRatio, so on a
     high-density display the browser upscales everything. Fixing that sharpens
     the whole field but multiplies fill cost; it is a decision, not a freebie.

   CHANGE LOG
   2026-07-24  caps removed (stars had a hard 240, law a hard 700); star mass
               made a bounded power law so giants are rare and real; the fall
               rewritten from a lerp-plus-fixed-upward-arc into an integrated
               ballistic descent that inherits the star's own momentum; every()
               rebuilt on float accumulators so pace no longer saturates at
               different thresholds per system; terminal no longer pre-fills its
               input and `help` opens a real panel; `summon` added for testing;
               ahika thresholds exposed; arrivals given much longer spans and
               named in the readout while they stand; aggressor's cuts made to
               open and linger; lattice links batched from ~2000 draw calls per
               frame to about ten.
   =========================================================================== */
"use strict";
const cv=document.getElementById('world'), X=cv.getContext('2d');
/* W/H are the world's logical size and always equal VW/VH — the field fits the
   window. Resizing scales the accumulated paint and silk into the new size so
   nothing is lost, then rebuilds the walker paths on the new dimensions. */
let W=0,H=0,VW=0,VH=0,viewScale=1,viewDx=0,viewDy=0;
let pathPhases={heart:0,love:2.1,temple:4.2,power:1.2};
let pHeart,pLove,pTemple,pPower;
const P=document.createElement('canvas'); const PX=P.getContext('2d');
const S=document.createElement('canvas'); const SX=S.getContext('2d');
let worldReady=false, resizePending=false;
function updateView(){
  viewScale=1;viewDx=0;viewDy=0;
  X.setTransform(1,0,0,1,0,0);
}
/* RESOLUTION IS NEVER SURRENDERED.
   The record layers are kept at a high-water mark: the largest logical size the
   world has ever occupied. A smaller window does not shrink the record, it
   merely views it through a scale factor, so detail painted at a large size
   survives being minimized and returns intact when the window grows again.
   Enlarging past the mark does resample once — unavoidable — but shrinking,
   which is the common case, is now lossless. */
let bakeW=0,bakeH=0,bakeScale=1;
function resizeLayer(canvas,ctx,newW,newH){
  if(newW===canvas.width&&newH===canvas.height)return;
  if(!canvas.width||!canvas.height){canvas.width=newW;canvas.height=newH;return;}
  const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;
  tmp.getContext('2d').drawImage(canvas,0,0);
  canvas.width=newW;canvas.height=newH;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(tmp,0,0,tmp.width,tmp.height,0,0,newW,newH);
}
/* Grow the backing store only; never shrink it. Returns true if it grew. */
function ensureBacking(w,h){
  const nw=Math.max(bakeW,w), nh=Math.max(bakeH,h);
  if(nw===bakeW&&nh===bakeH&&P.width===bakeW&&P.height===bakeH)return false;
  resizeLayer(P,PX,nw,nh);resizeLayer(S,SX,nw,nh);
  bakeW=nw;bakeH=nh;
  return true;
}
/* All world→record drawing goes through this transform, so a 1200px-wide world
   painting into a 1900px-wide record lands in the right place at full detail. */
function syncBakeTransform(){
  bakeScale=(bakeW&&W)?bakeW/W:1;
  const sy=(bakeH&&H)?bakeH/H:1;
  PX.setTransform(bakeScale,0,0,sy,0,0);
  SX.setTransform(bakeScale,0,0,sy,0,0);
}
function adoptLogicalWorld(w,h){
  w=Math.max(1,Math.round(w));h=Math.max(1,Math.round(h));
  W=w;H=h;
  ensureBacking(W,H);
  syncBakeTransform();
  if(VW&&VH)updateView();
  if(typeof setPaths==='function')setPaths();
}
function rs(){
  const nw=Math.max(1,innerWidth), nh=Math.max(1,innerHeight);
  if(nw===VW&&nh===VH)return;
  VW=nw;VH=nh;
  cv.width=VW;cv.height=VH;
  W=VW;H=VH;
  /* the record grows to meet the largest world seen, and never shrinks back */
  ensureBacking(W,H);
  syncBakeTransform();
  updateView();
  if(typeof setPaths==='function')setPaths();
  X.save();X.setTransform(1,0,0,1,0,0);X.fillStyle='#000';X.fillRect(0,0,VW,VH);X.restore();
}
addEventListener('resize',()=>{
  if(resizePending)return;
  resizePending=true;
  requestAnimationFrame(()=>{resizePending=false;rs();});
});
rs();
const TAU=Math.PI*2, rand=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,t)=>a+(b-a)*t;
let tick=0;
/* ============ PACE ============
   This is an idle world. Someone may look in every fifteen minutes, or leave
   it running all night and return in the morning; either way what they find
   should be a world that has been GETTING somewhere, not one that finished in
   the first ninety seconds and has been idling since.

   So every major development is slow by default and passes through this one
   dial. `pace` multiplies elapsed time: 1 is the true idle rate, higher values
   compress it. Small events — sparks, motes, glints — are untouched, because
   the texture of the world should stay alive at any speed; it is only the
   arrivals, the growth, and the deaths that are stretched.

   `slow(n)` scales an interval; `chance(p)` scales a per-frame probability. */
let pace=1;
function slow(n){ return Math.max(1, Math.round(n/pace)); }
function chance(p){ return Math.min(1, p*pace); }
/* every N ticks at the current pace, with a stable offset so independent
   systems do not all fire on the same frame */
/* `every` used to be (tick % round(n/pace))===0. Two faults: round() clamps at
   1, so a system on interval 9 stopped accelerating at pace 9 while one on
   2400 kept scaling to 500 -- past pace ~20 half the world was pinned and the
   other half was not, which is exactly the "pace does not affect everything
   at the same rate" complaint. And integer intervals cannot express 1.5.
   Now each call site keeps a float accumulator, so pace scales every system by
   the same factor with no saturation and no drift. Call sites are keyed by
   (n,off), which are constants at every site in this file -- if you ever pass
   a computed n, give it its own stable off. */
const _everyAcc = new Map();
function every(n,off){
  const k = n + ':' + (off||0);
  let a = _everyAcc.get(k);
  if(a === undefined){ a = (off||0) % n; }
  a += pace;
  if(a >= n){
    /* HOW MANY times it should have fired, not merely whether. At pace 1200 a
       system on interval 9 owes 133 firings in one frame; returning `true`
       gave it one, so short-interval systems silently stopped accelerating
       while long-interval ones kept scaling. Zero is falsy and any count is
       truthy, so every existing `if(every(...))` call site is unchanged --
       but a site that wants the real rate can now loop on the return. */
    const times = Math.floor(a / n);
    _everyAcc.set(k, a % n);
    return times;
  }
  _everyAcc.set(k, a); return 0;
}
/* Scaling only the FREQUENCY of events is not fast-forward — it is a world
   where more things start but each one still takes just as long, so at high
   pace the events pile on top of each other and the field becomes a fusillade.
   Fast-forward requires that DURATIONS shorten by the same factor: a star must
   fall faster, a stun must lift sooner, a cooldown must expire earlier. These
   two helpers are for durations.

   `dur(n)` shortens a countdown; `rate(v)` speeds a per-frame advance. Both are
   clamped so that at extreme pace a process still occupies a few frames rather
   than resolving inside one — the world should run fast, not skip. */
/* ---- motion under pace -------------------------------------------------
   Frequency and duration were paced; MOTION was not. Everything moved by a
   fixed amount per rendered frame, so at pace 1200 far more things happened
   but nothing crossed the field any faster -- which is exactly the "things
   don't seem to move 1200 times faster" report, and it was right.

   `mo` is how much world-time one rendered frame now covers. It is bounded,
   and the bound is a real one rather than a taste: this is explicit
   integration, and past a step of about forty a body can pass straight
   through what it should have hit. Above that, pace keeps accelerating
   events and durations, but motion holds at the largest step that is still
   physics. Raise MO_MAX only alongside a proper sub-stepped integrator.

   `damp(k)` is friction over a long step -- k applied mo times, not once.
   `pk(k)` is the same for a lerp: the coefficient that lands where mo
   successive lerps would have. Both are exact, not approximations. */
const MO_MAX=40;
function mo(){ return Math.min(MO_MAX, pace); }
function damp(k){ const m=mo(); return m===1?k:Math.pow(k,m); }
function pk(k){ const m=mo(); return m===1?k:1-Math.pow(1-k,m); }

function dur(n){ return Math.max(1, Math.round(n/pace)); }
function rate(v){ return Math.min(0.5, v*pace); }

/* ============ TUNING ============
   Every number a successor is likely to want to move lives here. Nothing in
   this block is load-bearing for correctness; each one is a taste dial. Names
   are stated as what they mean, not as what they multiply.
   -- 2026-07-24 pass: caps removed, star spectrum widened, fall made ballistic.
*/
const TUNE = {
  /* stars -------------------------------------------------------------- */
  STAR_CONDENSE    : 0.42,   /* chance a spent mote settles, BEFORE quiet is
                                applied. quiet is usually well under one, so
                                the effective rate is much lower than this and
                                rises on its own as the field spreads. NO CAP,
                                NO CLOCK -- see the condensation site. */
  STAR_SZ_MIN      : 0.40,   /* the smallest light that still counts as one */
  STAR_SZ_MAX      : 3.40,   /* the rare giant. see makeStar for the spectrum */
  STAR_SZ_ALPHA    : 1.45,   /* power-law index. HIGHER = fewer giants.
                                1.35-1.6 keeps giants at roughly 1 in 40. */
  /* the fall ------------------------------------------------------------ */
  FALL_INTERVAL    : 2000,   /* ticks between tithes, when the sky holds any */
  FALL_MIN_STARS   : 10,
  FALL_GRAV        : 15,     /* well strength during a descent. LOW is what
                                makes a fall a long shallow arc across the
                                field rather than a dive into the nearest
                                mass -- raise it and everything plummets. */
  FALL_DRAG        : 0.9985, /* the medium is not empty, but it is thin */
  FALL_SPEED       : 3.4,    /* the sideways speed it leaves with. this, more
                                than anything, is how far it gets. */
  FALL_MAX_AGE     : 9000,   /* a fall that finds nothing eventually lands */
  /* ahika --------------------------------------------------------------- */
  AHIKA_KEEP       : 0.62,   /* chance a deep strike leaves kept light */
  AHIKA_DEEP_FRAC  : 0.22,   /* fraction of the possible break that counts
                                as "the law was opened", floor of 3 circles */
  /* the law ------------------------------------------------------------- */
  LAW_SOFT         : 900,    /* past this the lattice keeps growing but slows */
  LAW_HARD         : 3000,   /* a memory ceiling, not a design one. it should
                                never be reached in an ordinary session. */
  /* the arrivals -------------------------------------------------------- */
  BRIDE_LIFE       : [52000, 96000],
  AGGR_LIFE        : [26000, 48000],
  ARRIVAL_MIN_LIFE : 5400,   /* pace may compress a life, but not below this.
                                a goddess who dies in four seconds is a
                                particle effect. */
};

function walker(cx,cy,rx,ry,sx,sy,ph){
  return ()=>[ cx + Math.sin(tick*sx+ph)*rx, cy + Math.sin(tick*sy+ph*1.7)*ry ];
}
function setPaths(){
  pHeart  = walker(W*0.5,H*0.42, W*0.30,H*0.26, 0.00052,0.00037, pathPhases.heart);
  pLove   = walker(W*0.5,H*0.45, W*0.33,H*0.30, 0.00031,0.00047, pathPhases.love);
  /* Law travels as widely as anything else; its slowness is not confinement. */
  pTemple = walker(W*0.50,H*0.50, W*0.34,H*0.30, 0.00019,0.00027, pathPhases.temple);
  pPower  = walker(W*0.58,H*0.55, W*0.27,H*0.24, 0.00043,0.00023, pathPhases.power);
}
setPaths();

/* ============ HEART ============ */
const heart={rings:[],sparks:[],skirt:[],shock:0};
const daughters=[];
function makeLawSkirtNode(i,source){
  const ring=i<4?0:i<10?1:2;
  const slot=ring===0?i:ring===1?i-4:i-10;
  const count=ring===0?4:ring===1?6:8;
  return {ring,a:slot*TAU/count+rand(-0.16,0.16),sp:(ring===1?-1:1)*rand(0.0025,0.0055),sz:rand(0.78,1.18),
    ice:!!(source&&source.kind==='ice'),origin:source?{x:source.x,y:source.y,kind:source.kind}:null};
}
function fillLawSkirt(skirt,n){while(skirt.length<n)skirt.push(makeLawSkirtNode(skirt.length));}
function lawSkirtPositions(x,y,scale,skirt){
  const out=[];
  for(const n of skirt||[]){
    const a=n.a+tick*n.sp,rx=(16+n.ring*9)*scale,ry=(6+n.ring*4)*scale;
    out.push({n,x:x+Math.cos(a)*rx,y:y+(11+n.ring*5)*scale+Math.sin(a)*ry,a});
  }
  return out;
}
function drawLawSkirt(x,y,scale,skirt,bright){
  if(!skirt||!skirt.length)return;
  const pts=lawSkirtPositions(x,y,scale,skirt),b=bright==null?1:bright;
  X.save();X.lineWidth=Math.max(0.42,0.62*scale);X.lineCap='round';
  for(let ring=0;ring<3;ring++){
    const row=pts.filter(p=>p.n.ring===ring).sort((a,c)=>a.a-c.a);
    if(row.length>1){
      X.strokeStyle='rgba(62,105,255,'+(0.19+0.16*b)+')';X.beginPath();X.moveTo(row[0].x,row[0].y);
      for(let i=1;i<row.length;i++)X.lineTo(row[i].x,row[i].y);
      if(row.length>3)X.lineTo(row[0].x,row[0].y);X.stroke();
    }
  }
  for(const p of pts){
    if(p.n.ice){
      X.fillStyle='rgba(145,250,255,'+(0.68+0.22*b)+')';
      X.beginPath();X.arc(p.x,p.y,(1.25+0.45*b)*p.n.sz*scale,0,TAU);X.fill();
    }else{
      X.fillStyle='rgba(82,126,255,'+(0.72+0.18*b)+')';
      X.beginPath();X.arc(p.x,p.y,(1.1+0.35*b)*p.n.sz*scale,0,TAU);X.fill();
    }
  }
  X.restore();
}
function scatterLawSkirt(owner,x,y,scale,fraction){
  if(!owner.skirt||!owner.skirt.length)return;
  const pts=lawSkirtPositions(x,y,scale,owner.skirt);
  for(let i=owner.skirt.length-1;i>=0;i--){
    if(Math.random()<fraction){
      const p=pts[i];
      addElementImpact('temple',p.x,p.y,0.22);
      skirtRain.push({x:p.x,y:p.y,vx:rand(-0.7,0.7),vy:rand(-0.5,0.1),age:0,life:rand(50,110),ice:p.n&&p.n.ice});
      owner.skirt.splice(i,1);
    }
  }
}
function spendLawSkirt(owner,x,y,scale,count){
  if(!owner.skirt||!owner.skirt.length)return 0;
  const pts=lawSkirtPositions(x,y,scale,owner.skirt);
  const indices=owner.skirt.map((_,i)=>i);
  for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]];}
  const chosen=indices.slice(0,Math.min(count,indices.length)).sort((a,b)=>b-a);
  for(const i of chosen){
    const p=pts[i];
    addElementImpact('temple',p.x,p.y,0.28);
    skirtRain.push({x:p.x,y:p.y,vx:rand(-0.7,0.7),vy:rand(-0.5,0.05),age:0,life:rand(60,120),ice:p.n&&p.n.ice});
    owner.skirt.splice(i,1);
  }
  return chosen.length;
}
function heartAmp(ph){ const c=((tick+ph)%lore.beat)/lore.beat;
  return Math.exp(-c*6)*Math.max(0,Math.sin(c*Math.PI*10)) + Math.exp(-((c-0.15+1)%1)*6)*0.6; }
function updateHeart(hx,hy){
  heart.shock*=0.90;
  const c=tick%lore.beat;
  if(c===0||c===Math.floor(lore.beat*0.15)){
    heart.rings.push({r:20,a:1});
    for(let i=0,n=4+Math.floor(Math.random()*4);i<n;i++){
      const an=rand(0,TAU),sp=rand(0.8,2.4);
      heart.sparks.push({x:hx,y:hy,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,age:0,life:rand(120,260)});
    }
  }
  for(let i=heart.rings.length-1;i>=0;i--){
    const r=heart.rings[i]; r.r+=1.7; r.a*=0.972;
    if(r.a<0.02) heart.rings.splice(i,1);
  }
  for(let i=daughters.length-1;i>=0;i--){
    const h=daughters[i]; h.age++;h.shock=(h.shock||0)*0.88;if(!h.skirt)h.skirt=[];
    /* III. POWER→HEART — rot leans on the fire: spent, not slain */
    let ng=false;
    for(const G of gyres){
      if((G.x-h.x)**2+(G.y-h.y)**2<(180*G.scale)**2){ng=true;break;}
    }
    if(ng){
      h.age+=1;
      if(Math.random()<0.02){
        const an=rand(0,TAU);
        heart.sparks.push({x:h.x,y:h.y,vx:Math.cos(an)*1.4,vy:Math.sin(an)*1.4,age:0,life:rand(60,120)});
      }
    }
    h.hot=lerp(h.hot||0, ng?1:0, 0.04);
    h.vx+=(Math.random()-0.5)*0.05; h.vy+=(Math.random()-0.5)*0.05;
    const _m=mo(); h.vx*=damp(0.98); h.vy*=damp(0.98); h.x+=h.vx*_m; h.y+=h.vy*_m;
    if((tick+h.ph)%lore.beat===0 && Math.random()<0.6){
      const an=rand(0,TAU);
      heart.sparks.push({x:h.x,y:h.y,vx:Math.cos(an)*1.2,vy:Math.sin(an)*1.2,age:0,life:rand(80,160)});
    }
    if(h.age>h.life){
      PX.fillStyle='rgba(110,25,18,0.5)';
      PX.beginPath(); PX.arc(h.x,h.y,2.6,0,TAU); PX.fill();
      daughters.splice(i,1);
    }
  }
}
/* beating orb */
function drawHeartBody(x,y,scale,ph,hot,shock){
  hot=hot||0;
  shock=shock||0;
  const amp=heartAmp(ph);
  const R=(15+amp*8)*scale;
  let g=X.createRadialGradient(x,y,0,x,y,R*3.4);
  g.addColorStop(0,'rgba(255,50,30,'+(0.30+amp*0.32)+')');
  g.addColorStop(0.45,'rgba(200,15,15,'+(0.10+amp*0.12)+')');
  g.addColorStop(1,'rgba(255,0,0,0)');
  X.fillStyle=g; X.beginPath(); X.arc(x,y,R*3.4,0,TAU); X.fill();
  let bg=X.createRadialGradient(x-R*0.3,y-R*0.3,R*0.1,x,y,R);
  bg.addColorStop(0,'rgba(230,60,45,0.98)');
  bg.addColorStop(0.55,'rgba(160,15,16,0.97)');
  bg.addColorStop(1,'rgba(95,8,12,0.95)');
  X.fillStyle=bg; X.beginPath(); X.arc(x,y,R,0,TAU); X.fill();
  X.strokeStyle='rgba(255,90,70,'+(0.20+amp*0.4)+')'; X.lineWidth=1;
  X.beginPath(); X.arc(x,y,R,0,TAU); X.stroke();
  /* ember core flaring on the beat — fevered near the turning */

/* ============ LOVE ============ */
const love={x:0,y:0,init:false,gazeA:0,gazeTarget:0,hitVx:0,hitVy:0,shock:0,stun:0,skirt:[],guard:0};
/* GREEN·BLUE is the holiest of the crossings, so what green gathers is not
   plain law but ICE — law already cooled by being seen. Her skirt is the
   contact surface itself, worn. She does not take it from the lattice: she
   makes it, out of the sight she spends on the temple. */
function drawLoveSkirt(x,y,scale,skirt,bright){
  if(!skirt||!skirt.length)return;
  const b=bright==null?1:bright;
  const pts=[];
  for(const n of skirt){
    const a=n.a+tick*n.sp, rx=(19+n.ring*10)*scale, ry=(7+n.ring*4.5)*scale;
    pts.push({n,x:x+Math.cos(a)*rx,y:y+(12+n.ring*5.5)*scale+Math.sin(a)*ry,a});
  }
  X.save(); X.lineWidth=Math.max(0.42,0.66*scale); X.lineCap='round';
  /* The dress is graded by depth. Close to her body the law is still nearly
     pure BLUE — dense, dark, barely touched. Further out it has been longer in
     her light, and thins toward pale cyan at the hem. The gradient IS the
     crossing: you can see how far GREEN has gotten into BLUE by how light it
     has become. Nothing here is decorative; the hue is the reading. */
  for(let ring=0;ring<3;ring++){
    const row=pts.filter(p=>p.n.ring===ring).sort((c,d)=>c.a-d.a);
    if(row.length>1){
      const t=ring/2;
      const rr=Math.floor(lerp(28,150,t)), gg=Math.floor(lerp(96,242,t)), bb=Math.floor(lerp(235,246,t));
      X.strokeStyle='rgba('+rr+','+gg+','+bb+','+(0.18+0.18*b)+')';
      X.beginPath(); X.moveTo(row[0].x,row[0].y);
      for(let i=1;i<row.length;i++)X.lineTo(row[i].x,row[i].y);
      if(row.length>3)X.lineTo(row[0].x,row[0].y);
      X.stroke();
    }
  }
  for(const p of pts){
    const t=p.n.ring/2;
    const rr=Math.floor(lerp(40,168,t)), gg=Math.floor(lerp(118,252,t)), bb=Math.floor(lerp(255,255,t));
    X.fillStyle='rgba('+rr+','+gg+','+bb+','+(0.66+0.26*b)+')';
    X.save(); X.translate(p.x,p.y); X.rotate(0.785);
    const s2=(1.5+0.5*b)*p.n.sz*scale;
    X.fillRect(-s2,-s2,s2*2,s2*2);
    X.restore();
  }
  X.restore();
}
function growLoveSkirt(tx,ty){

     debt is already paid in glints — but wearing is a different act, and it
     costs contact. A circle joins her skirt only when her body physically
     overlaps a settled ice node, and only ice that has had time to become part
     of a constellation: she gathers from what green and blue have already
     built together, at the speed they build it. Nothing here is instant. */
  if(!love.skirt)love.skirt=[];
  if(love.stun>0)return;
  if(love.skirt.length>=18)return;
  if(!every(150,19))return;
  /* Her reach is her FIELD, not a pinprick. She is a body some forty pixels
     across with a glow past that, and asking her to touch a circle within
     thirty-four pixels of her exact center meant that in twenty thousand
     frames she never once made contact — a hundred eligible circles sat in
     the lattice and the dress could not begin. Contact means the ice is
     inside her light. */
  const REACH=86, REACH2=REACH*REACH;
  let best=-1,bd=REACH2;
  for(let i=0;i<temple.pts.length;i++){
    const p=temple.pts[i];
    /* only ice, only settled, and only ice with company — a lone frozen node
       is not yet a constellation, and she takes nothing from an isolated law */
    if(p.kind!=='ice'||p.set<1||p.rot>0||p.hermetic)continue;
    const wx=tx+p.x, wy=ty+p.y;
    const d=(wx-love.x)**2+(wy-love.y)**2;
    if(d<bd){
      /* only ice with company: a lone frozen node is not a constellation.
         asked through the lattice's own hash rather than by walking it all. */
      let kin=0;
      if(templeGridN!==temple.pts.length)rebuildTempleGrid();
      const cx=(p.x/TCELL)|0, cy=(p.y/TCELL)|0;

      for(let gx=cx-1;gx<=cx+1;gx++)for(let gy=cy-1;gy<=cy+1;gy++){
        const b=templeGrid.get(gx+','+gy);
        if(!b)continue;
        for(const q of b){
          if(q===p||q.kind!=='ice')continue;
          if((q.x-p.x)**2+(q.y-p.y)**2<820){kin++;if(kin>=2)break outer;}
        }
      }
      if(kin>=2){bd=d;best=i;}
    }

function updateLove(targets){

     criterion; a criterion that gets stuck inside one of its own objects has

        let bw=-1;

    const dd=rand(60,Math.max(W,H)*0.55);

  }
}

/* ============ TEMPLE ============ */
const temple={pts:[],nextAt:0,iceCount:0,shock:0};
/* Admissibility is a local question — only nearby circles can crowd a seat —
   so it is answered with a spatial hash rebuilt as the lattice changes rather
   than by walking every circle of law for every candidate. */
let templeGrid=new Map(), templeGridN=-1;
const TCELL=30;
function templeGridKey(x,y){return ((x/TCELL)|0)+','+((y/TCELL)|0);}
function rebuildTempleGrid(){
  templeGrid=new Map();
  for(const p of temple.pts){
    const k=templeGridKey(p.x,p.y);
    let b=templeGrid.get(k); if(!b){b=[];templeGrid.set(k,b);}
    b.push(p);
  }
  templeGridN=temple.pts.length;
}
function seatFree(nx,ny,min2){
  if(templeGridN!==temple.pts.length)rebuildTempleGrid();
  const cx=(nx/TCELL)|0, cy=(ny/TCELL)|0;
  for(let gx=cx-1;gx<=cx+1;gx++)for(let gy=cy-1;gy<=cy+1;gy++){
    const b=templeGrid.get(gx+','+gy);
    if(!b)continue;
    for(const p of b) if((p.x-nx)**2+(p.y-ny)**2<min2) return false;
  }
  return true;
}
function addLawPoint(nx,ny,kind){
  const p={x:nx,y:ny,set:0,kind:kind||'law',rot:0};
  temple.pts.push(p);
  const k=templeGridKey(nx,ny);
  let b=templeGrid.get(k); if(!b){b=[];templeGrid.set(k,b);}
  b.push(p); templeGridN=temple.pts.length;
  return p;
}
function updateTemple(tx,ty){
  temple.shock*=0.89;
  if(temple.pts.length===0) temple.pts.push({x:0,y:0,set:1,kind:'law',rot:0});
  if(tick>temple.nextAt && temple.pts.length<TUNE.LAW_HARD){
    /* the lattice takes hours, not minutes, to fill a field */
    /* growth used to ACCELERATE with size (240 - n*0.22), which is why the
       lattice raced to its old 700-circle wall and stopped dead. Rule spreads
       into unruled ground easily and into ruled ground slowly, so the interval
       now lengthens as the lattice fills: it approaches a size instead of
       hitting one, and no number has to forbid anything. */
    const fill = temple.pts.length / TUNE.LAW_SOFT;
    temple.nextAt = tick + slow(Math.round(26 + 210*fill*fill));
    /* Law does not thicken where it already is. Growth prefers the frontier:
       three candidate parents are drawn and the one furthest from the seat
       wins, so the lattice reaches instead of piling. Step length varies —
       rule applied to unlike ground does not produce identical spacing.
       A blocked direction is not a lost turn: rule persists, trying seats
       around the parent until one is admissible. */
    let placed=false;
    for(let attempt=0;attempt<7&&!placed;attempt++){
      let base=null,br=-1;
      for(let k=0;k<3;k++){
        const c=temple.pts[Math.floor(Math.random()*temple.pts.length)];
        const r=c.x*c.x+c.y*c.y;
        if(r>br){br=r;base=c;}
      }
      const dir=Math.floor(rand(0,6))*TAU/6+TAU/12+rand(-0.09,0.09);
      const step=lore.lattice*rand(0.92,1.5);
      const nx=base.x+Math.cos(dir)*step, ny=base.y+Math.sin(dir)*step;
      /* a wider exclusion radius: circles of law keep their distance */
      if(seatFree(nx,ny,150)){ addLawPoint(nx,ny,'law'); placed=true; }
    }
  }
  /* TEMPLE is not a place. Rule makes itself manifest wherever there is ground
     to bear it, so the law occasionally founds a distant precinct — a lone
     circle far from the seat, which then grows on its own terms. */
  if(every(5400,131) && temple.pts.length>40 && temple.pts.length<TUNE.LAW_HARD){
    const a=rand(0,TAU), r=rand(210,Math.max(260,Math.min(W,H)*0.42));
    const nx=Math.cos(a)*r, ny=Math.sin(a)*r;
    if(tx+nx>10&&tx+nx<W-10&&ty+ny>10&&ty+ny<H-10&&seatFree(nx,ny,150))
      addLawPoint(nx,ny,'law');
  }
  if(every(150,7)){
    const iced=temple.pts.filter(p=>p.kind==='ice');
    /* ice spreads slowly and never claims the whole lattice — deep blue must survive */
    if(iced.length < temple.pts.length*0.4){
      for(const ip of iced){
        if(Math.random()<0.04){
          for(const p of temple.pts){
            if(p.kind==='law'&&p.rot===0){
              const d=(p.x-ip.x)**2+(p.y-ip.y)**2;
              if(d<820){ p.kind='ice'; emitGlints(tx+p.x,ty+p.y,tx,ty,2); break; }
            }
          }
          break;
        }
      }
    }
  }
  temple.iceCount=0;
  for(let i=temple.pts.length-1;i>=0;i--){
    const p=temple.pts[i];
    if(p.kind==='ice') temple.iceCount++;
    if(p.set<1)p.set+=0.02;
    if(p.rot>0){ p.rot+=0.015; if(p.rot>=1) temple.pts.splice(i,1); }
  }
}
function chooseKeptSeat(goddess){
  const lo=goddess?34:18, hi=goddess?118:82;
  let cands=temple.pts.filter(p=>{
    const r=Math.hypot(p.x,p.y);
    if((p.kind!=='law'&&p.kind!=='ice')||p.rot>0||p.hermetic||p.set<0.72||r<lo||r>hi)return false;
    for(const e of embers)if((e.x-p.x)**2+(e.y-p.y)**2<(goddess?28:20)**2)return false;
    return true;
  });
  if(cands.length){const p=cands[Math.floor(Math.random()*cands.length)];return {x:p.x,y:p.y};}
  const a=rand(0,TAU),r=rand(lo,hi);return {x:Math.cos(a)*r,y:Math.sin(a)*r};
}
function makeKeptFire(){
  /* no red is appointed a goddess. every kept fire begins plain,
     and earns the dress by gathering nine circles of law. */
  const p=chooseKeptSeat(false);

function drawLawGoddess(e,pul){
  const s=e.scale||1;if(!e.skirt)e.skirt=[];
  /* The dress is literally gathered law: orbiting blue circles whose faint
     links form a constellation around a small red heart. */
  drawLawSkirt(e.x,e.y-3*s,0.62*s,e.skirt,pul);
  drawHeartBody(e.x,e.y-7*s,0.27*s,e.ph,0,0);

function drawTemple(tx,ty){
  X.save(); X.translate(tx,ty);
  X.lineWidth=0.6;
  const n=temple.pts.length;
  /* Links are found through the lattice's own maintained spatial hash rather
     than by testing every pair, and the hash is not rebuilt each frame — rule
     is local and persistent, so the structure that expresses it should be too.

     A circle binds only to its nearest few neighbours. Law that connected to
     everything within reach would draw itself as a solid mat, which is the
     opposite of what a lattice is: structure is visible relation, and relation
     that omits nothing is not structure. Six is the hexagonal maximum. */
  const LINK2=820, MAXLINKS=6;
  if(templeGridN!==n)rebuildTempleGrid();
  /* PERFORMANCE, without losing a pixel.
     Every link used to be its own beginPath/stroke with its own freshly built
     'rgba(...)' string -- about two thousand draw calls and two thousand string
     allocations per frame at a grown lattice, which is most of why a long
     session starts to feel heavy. The alpha only ever takes a handful of
     meaningful values, so links are collected into buckets by (ice, quantised
     alpha) and each bucket is stroked once as a single path. Identical output,
     roughly ten draw calls instead of two thousand. The textures are untouched:
     this changes only how many times the canvas is asked, never what it draws. */
  const LBUCKETS=6;
  const bucket=[]; for(let q=0;q<LBUCKETS*2;q++)bucket.push(null);
  const near=[];
  for(let i=0;i<n;i++){
    const a=temple.pts[i];
    const cx=(a.x/TCELL)|0, cy=(a.y/TCELL)|0;
    near.length=0;
    for(let gx=cx-1;gx<=cx+1;gx++){
      for(let gy=cy-1;gy<=cy+1;gy++){
        const bucket=templeGrid.get(gx+','+gy);
        if(!bucket)continue;
        for(let jj=0;jj<bucket.length;jj++){
          const b=bucket[jj];
          if(b===a)continue;
          const dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
          if(d2<LINK2)near.push(d2,b);
        }
      }
    }
    if(!near.length)continue;
    /* keep the nearest MAXLINKS, and draw each pair once by position order */
    const cnt=near.length>>1;
    if(cnt>MAXLINKS){
      for(let p=0;p<MAXLINKS;p++){
        let bi=p;
        for(let q=p+1;q<cnt;q++) if(near[q*2]<near[bi*2]) bi=q;
        if(bi!==p){
          const d0=near[p*2],o0=near[p*2+1];
          near[p*2]=near[bi*2];near[p*2+1]=near[bi*2+1];
          near[bi*2]=d0;near[bi*2+1]=o0;
        }
      }
    }
    const lim=Math.min(cnt,MAXLINKS);
    for(let p=0;p<lim;p++){
      const b=near[p*2+1];
      if(!(b.x>a.x||(b.x===a.x&&b.y>a.y)))continue;
      const ice=(a.kind==='ice'&&b.kind==='ice');
      const set=Math.min(a.set,b.set);
      const q=ice?0:Math.max(0,Math.min(LBUCKETS-1,Math.round(set*(LBUCKETS-1))));
      const idx=(ice?LBUCKETS:0)+q;
      let arr=bucket[idx]; if(!arr){arr=bucket[idx]=[];}
      arr.push(a.x,a.y,b.x,b.y);
    }
  }
  for(let idx=0;idx<bucket.length;idx++){
    const arr=bucket[idx]; if(!arr||!arr.length)continue;
    const ice=idx>=LBUCKETS;
    const q=idx-(ice?LBUCKETS:0);
    X.strokeStyle= ice ? 'rgba(130,255,255,0.42)'
                       : 'rgba(50,85,255,'+(0.30*(q/(LBUCKETS-1)))+')';
    X.beginPath();
    for(let k=0;k<arr.length;k+=4){
      X.moveTo(arr[k],arr[k+1]); X.lineTo(arr[k+2],arr[k+3]);
    }
    X.stroke();
  }
  for(const p of temple.pts){
    const s=p.set;
    if(p.kind==='ice'){
      const pul=0.6+0.4*Math.sin(tick*0.04+p.x);
      X.save(); X.translate(p.x,p.y); X.rotate(0.785);
      X.fillStyle='rgba(160,255,255,'+(0.9*pul)+')';
      X.fillRect(-1.9,-1.9,3.8,3.8);
      X.restore();
    } else {
      const rot=p.rot;
      X.fillStyle= rot>0
        ? 'rgba('+Math.floor(lerp(90,230,rot))+','+Math.floor(lerp(130,0,rot))+',255,'+(0.85*(1-rot*0.4))+')'
        : 'rgba(95,135,255,'+(0.85*s)+')';
      X.beginPath(); X.arc(p.x,p.y,1.5+s*0.7,0,TAU); X.fill();
      if(s<1){
        X.strokeStyle='rgba(160,190,255,'+(0.6*(1-s))+')';
        X.beginPath(); X.arc(p.x,p.y,6*(1-s)+2,0,TAU); X.stroke();
      }
    }
  }
  X.fillStyle='rgba(205,225,255,0.9)';
  X.beginPath(); X.arc(0,0,2.4,0,TAU); X.fill();
  if(temple.shock>0.02){
    const sg=X.createRadialGradient(0,0,0,0,0,34+temple.shock*38);
    sg.addColorStop(0,'rgba(145,220,255,'+(0.55*temple.shock)+')');sg.addColorStop(1,'rgba(40,80,255,0)');
    X.fillStyle=sg;X.beginPath();X.arc(0,0,34+temple.shock*38,0,TAU);X.fill();
  }
  /* I. embers: fire the law holds */
  for(const e of embers){
    if(e.enthrone){
      const dx=e.enthrone.x-e.x,dy=e.enthrone.y-e.y;
      e.x+=dx*0.012;e.y+=dy*0.012;
      if(dx*dx+dy*dy<0.36)delete e.enthrone;
    }
    const pul=0.55+0.45*Math.sin(tick*0.05+e.ph);
    if(e.kind==='goddess'){drawLawGoddess(e,pul);continue;}
    if(e.kind==='ember'&&e.skirt&&e.skirt.length){
      /* a plain kept fire, mid-gathering: the dress half-made */
      drawLawSkirt(e.x,e.y+2,0.4,e.skirt,pul*0.8);
    }
    if(e.kind==='star'){
      /* kept light: a star the law holds — gold in the crystal */
      let kg=X.createRadialGradient(e.x,e.y,0,e.x,e.y,12);
      kg.addColorStop(0,'rgba(255,238,140,'+(0.5*pul)+')');
      kg.addColorStop(1,'rgba(255,200,0,0)');
      X.fillStyle=kg; X.beginPath(); X.arc(e.x,e.y,12,0,TAU); X.fill();
      X.save(); X.translate(e.x,e.y); X.rotate(0.785);
      X.fillStyle='rgba(255,244,'+(150+Math.floor(pul*80))+','+(0.8*pul+0.15)+')';
      X.fillRect(-2.1,-2.1,4.2,4.2); X.restore();
      X.save(); X.globalCompositeOperation='lighter';
      let khg=X.createRadialGradient(e.x,e.y,0,e.x,e.y,7.5);
      khg.addColorStop(0,'rgba(255,248,200,'+(0.30*pul)+')');
      khg.addColorStop(1,'rgba(255,214,110,0)');
      X.fillStyle=khg; X.beginPath(); X.arc(e.x,e.y,7.5,0,TAU); X.fill();
      X.restore();
      continue;
    }
    let eg=X.createRadialGradient(e.x,e.y,0,e.x,e.y,11);
    eg.addColorStop(0,'rgba(255,90,40,'+((0.45+0.3*bondSeen)*pul)+')');
    eg.addColorStop(1,'rgba(255,40,0,0)');
    X.fillStyle=eg; X.beginPath(); X.arc(e.x,e.y,11,0,TAU); X.fill();
    X.save(); X.translate(e.x,e.y); X.rotate(0.785);
    X.fillStyle='rgba(255,'+(110+Math.floor(pul*100))+',60,'+(0.85*pul+0.1)+')';
    X.fillRect(-2,-2,4,4);
    X.restore();
  }
  X.restore();
}

/* ============ POWER ============ */
function makeGyre(x,y,scale,root){
  return {x,y,scale,root,orbiters:[],out:[],energy:1,shock:0,age:0,life:root?1e9:rand(2200,4200)};
}
const gyres=[ makeGyre(0,0,1,true) ];
function updateGyres(px,py){
  gyres[0].x=px; gyres[0].y=py;
  if(gyres[0].root)gyres[0].scale=lore.gyreScale;
  for(let gi=gyres.length-1;gi>=0;gi--){
    const G=gyres[gi]; G.age++;G.shock=(G.shock||0)*0.90;
    /* how much law is actually near enough to bind this vortex. counted, not
       assumed: constraint is proportional to the rule present on the ground. */
    if(tick%24===0){
      /* counted by sample, not by census: how much rule is present near the
         turning is a proportion, and a proportion does not need every circle
         inspected to be known. */
      const pts=temple.pts, L=pts.length, stride=L>120?3:1;
      let n=0;
      for(let k=(tick/24|0)%stride;k<L;k+=stride){
        const p=pts[k];
        const d=(tPos.x+p.x-G.x)**2+(tPos.y+p.y-G.y)**2;
        if(d<(210*G.scale)**2)n++;
      }
      n*=stride;
      G.lawNear=n;
      G.lawGrip=lerp(G.lawGrip||0,Math.min(1,n/55),0.25);
    }
    if(G.lawGrip>0.35){
      /* bounded by rule, the turning cannot run away with itself. standing is
         local: a lattice elsewhere does not govern what turns here. */
      const ceil=2.2-1.0*G.lawGrip;
      if(G.energy>ceil)G.energy=lerp(G.energy,ceil,0.02);
    }
    const cap=Math.floor(40*G.scale);
    while(G.orbiters.length<cap)
      G.orbiters.push({
        a:rand(0,TAU),r:rand(18,100*G.scale),sp:rand(0.004,0.014),
        w:rand(0.6,1.6),hue:Math.random(),px:0,py:0,fresh:true,trail:[],
        silkPhase:rand(0,TAU),silkSpeed:rand(0.018,0.035),silkWidth:rand(0.72,1.08)
      });
    G.energy=lerp(G.energy,1,rate(0.002));
    /* IV. POWER→LOVE — the unwriting: rot slowly erases the record where it walks */
    if(tick%3===0){
      PX.globalCompositeOperation='destination-out';
      const eg=PX.createRadialGradient(G.x,G.y,0,G.x,G.y,60*G.scale);
      eg.addColorStop(0,'rgba(0,0,0,0.012)');
      eg.addColorStop(1,'rgba(0,0,0,0)');
      PX.fillStyle=eg; PX.beginPath(); PX.arc(G.x,G.y,60*G.scale,0,TAU); PX.fill();
      PX.globalCompositeOperation='source-over';
    }
    if(!G.root){
      G.x+=Math.sin(tick*0.001+G.age*0.0007)*0.15;
      G.y+=Math.cos(tick*0.0013+G.age*0.0005)*0.12;
      if(G.age>G.life){
        PX.fillStyle='rgba(70,10,60,0.4)';
        PX.beginPath(); PX.arc(G.x,G.y,5,0,TAU); PX.fill();
        gyres.splice(gi,1); continue;
      }
    }
    for(const o of G.orbiters){
      /* Old saves do not contain visual silk state; seed it lazily without
         touching the orbiter's position, velocity, blessing, or lifetime. */
      if(o.silkPhase===undefined){
        o.silkPhase=rand(0,TAU);
        o.silkSpeed=rand(0.018,0.035);
        o.silkWidth=rand(0.72,1.08);
      }
      if(!o.trail)o.trail=[];
      o.silkPhase+=o.silkSpeed;
      const lx=Math.cos(o.a)*o.r,ly=Math.sin(o.a)*o.r;
      const nx=G.x+lx, ny=G.y+ly;
      if(o.fresh)o.trail.length=0;
      if(!o.fresh&&!o.skipSilk){
        const t=Math.max(0,(120*G.scale-o.r)/(113*G.scale));
        /* Quiet Silk is the world-space circle left behind. Its original sparse
           gate, rim suppression, colors and narrow width remain intact. */
        const rimPinned=o.blessed>0.1 && o.r>135*G.scale;
        const silkOpen=Math.sin(o.silkPhase)>0.82;
        if(!rimPinned && silkOpen){
          if(o.blessed>0.1)
            SX.strokeStyle='rgba(160,255,200,'+(0.24*o.blessed)+')';
          else{
            const rr=Math.floor(lerp(180,255,o.hue)), bb=Math.floor(lerp(255,190,o.hue));
            SX.strokeStyle='rgba('+rr+','+Math.floor(t*50)+','+bb+','+(0.10+t*0.28)+')';
          }
          SX.lineWidth=(0.45+t*1.35)*G.scale*o.silkWidth;
          SX.lineCap='round';
          SX.beginPath(); SX.moveTo(o.px,o.py); SX.lineTo(nx,ny); SX.stroke();
        }
      }
      const depth=Math.max(0,(120*G.scale-o.r)/(113*G.scale));
      o.trail.push({x:lx,y:ly,depth,hue:o.hue,blessed:o.blessed||0});
      if(o.trail.length>36)o.trail.shift();
      o.px=nx;o.py=ny;o.fresh=false;o.skipSilk=false;
      if(inGaze(nx,ny)){ o.r+=0.4; o.blessed=1; }
      else if(inRefract(nx,ny)){ o.r+=0.16; o.blessed=Math.max(o.blessed||0,0.55); }
      else if(o.blessed) o.blessed*=0.95;
      o.a += (3.2/(o.r+24))*G.energy*(1+0.15*Math.sin(tick*0.01+o.hue*9));
      o.r -= 0.05*o.w*G.energy*(1+0.3*Math.sin(tick*0.008+o.a));
      /* TEMPLE·POWER — 💙🩷. Law acting on rot is not violence and not
         devouring; it is CONSTRAINT. Within reach of the lattice the vortex
         may still turn, but it may not turn just anywhere: its radii are
         pulled onto discrete shells spaced by the lattice constant, and its
         drift inward is slowed. Rule does not stop the turning. It tells the
         turning where it is allowed to be. */
      if(G.lawGrip>0.02){
        const q=lore.lattice*1.6;
        const shell=Math.round(o.r/q)*q;
        o.r=lerp(o.r,shell,0.05*G.lawGrip);
        o.a+=0.0006*G.lawGrip*Math.sign(Math.sin(o.a*3));
      }
      const rmax=122*G.scale;
      /* no rim-pinning: pushed past the edge, a thread is re-sown inward */
      if(o.r>rmax){ o.r=rand(58,95)*G.scale; o.a=rand(0,TAU); o.blessed=0; o.fresh=true; }
      if(o.r<7*G.scale){
        o.r=rand(78,105)*G.scale; const ea=rand(0,TAU); o.a=ea; o.hue=Math.random(); o.fresh=true;
        G.out.push({x:G.x+Math.cos(ea)*8,y:G.y+Math.sin(ea)*8,
          vx:Math.cos(ea)*rand(0.7,1.7),vy:Math.sin(ea)*rand(0.7,1.7),age:0,life:rand(80,180)});
      }
    }
    for(let i=G.out.length-1;i>=0;i--){
      const q=G.out[i]; q.age++;
      const _m=mo(); q.x+=q.vx*_m; q.y+=q.vy*_m; q.vx*=damp(0.985); q.vy*=damp(0.985);
      if(q.age>q.life) G.out.splice(i,1);
    }
    if(G.root && G.energy>1.9 && gyres.length<4){
      const ba=rand(0,TAU);
      gyres.push(makeGyre(G.x+Math.cos(ba)*rand(160,260), G.y+Math.sin(ba)*rand(140,220), rand(0.4,0.6), false));
      G.energy=1.2;
    }
  }
}
function drawGyreTrails(){
  /* the vortex at full voice: additive ribbons of true motion, riding above
     the quiet silk. the silk is texture; THIS is the fire.
     illumination is local: green relights only the portions it actually
     crosses, never an entire thread merely because its head is beheld. */
  X.save(); X.globalCompositeOperation='lighter'; X.lineCap='round';
  for(const G of gyres){
    const pf=Math.min(1,G.petrify||0);
    for(const o of G.orbiters){
      const h=o.trail||[],n=h.length;if(n<2)continue;
      for(let i=1;i<n;i++){
        const p=h[i-1],q=h[i],age=i/(n-1);
        const x1=G.x+p.x,y1=G.y+p.y,x2=G.x+q.x,y2=G.y+q.y;
        const mx=(x1+x2)*0.5,my=(y1+y2)*0.5;
        const litSegment=(p.blessed>0.5)||(q.blessed>0.5)||inGaze(mx,my)||inRefract(mx,my);
        const width=(0.6+q.depth*1.9)*G.scale*(0.62+age*0.38);
        if(pf>0){
          /* judged by the goddess: color drains toward stone */
          X.strokeStyle='rgba('+Math.floor(lerp(210,165,pf))+','+Math.floor(lerp(60,190,pf))+','+Math.floor(lerp(235,225,pf))+','+((0.08+age*0.42)*(1-0.3*pf))+')';
          X.lineWidth=width;
        } else if(litSegment){
          /* beheld: mint on the pink, held short of white */
          X.strokeStyle='rgba(160,255,200,'+(0.10+age*0.52)+')';
          X.lineWidth=width*1.2;
        }else{
          const rr=Math.floor(lerp(180,255,q.hue)),bb=Math.floor(lerp(255,190,q.hue));
          X.strokeStyle='rgba('+rr+','+Math.floor(q.depth*50)+','+bb+','+(0.07+age*0.48)+')';
          X.lineWidth=width;
        }
        X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();
      }
    }
  }
  X.restore();
}
function drawGyres(){

function drawElementImpacts(){

       green has often frozen solid, and a body that warm does not sit politely
       beside ice: taking it thaws it. Refusing ice made the dress impossible
       wherever GREEN had been thorough, which is exactly where kept fires are.
       Plain law is still preferred — it comes free — but ice will serve. */
    if(p.kind!=='law'&&p.kind!=='ice')continue;

            temple.pts.push({x:q.x-tx,y:q.y-ty,set:0,kind:'law',rot:0});

    if(m.vx===undefined)m.vx=rand(-0.22,0.22);

         rising ended -- but only if it ended somewhere QUIET. Light settles
         where nothing is working on it, so the chance is a function of how
         far the mote got from the four masses and from every turning, and of
         nothing else. No tick is consulted.

         CONSEQUENCE: early on the world is small and everything is close to
         everything, so almost nothing is far enough from a disturbance to
         settle. As the field spreads and cools, quiet ground appears and
         stars begin. Waiting for the first one is waiting for the cosmos to
         become big enough to have somewhere still in it. */

        stars.push(makeStar(m.x,m.y,m.vx*0.5,m.vy*0.35));

    X.beginPath(); X.arc(m.x,m.y,2.2*a+0.5,0,TAU); X.fill();
  }

    const f=ferments[i]; f.age++;
    const G=f.g||gyres[0];
    const dx=G.x-f.x, dy=G.y-f.y, d=Math.hypot(dx,dy)||1;
    f.vx+=dx/d*0.03; f.vy+=dy/d*0.03;

    X.beginPath(); X.arc(f.x,f.y,1.7,0,TAU); X.fill();
  }

}
/* ============ the two ordered spellings ============
   HEART·TEMPLE: red acts on blue, imposing a hermetic boundary on law.
   TEMPLE·HEART: blue acts on red, capturing and clothing fire as a core.
   LOVE can reveal either event. Her presence never transposes their order. */
function heartTempleSeam(hx,hy,tx,ty){
  const near=Math.hypot(hx-tx,hy-ty)<210;
  const hermetic=[];
  for(const p of temple.pts){
    if(!p.hermetic)continue;
    const h=p.hermetic;h.age++;
    const pulse=1+0.035*heartAmp(0),a=h.a,r=h.r*pulse;
    const targetX=hx-tx+Math.cos(a)*r,targetY=hy-ty+Math.sin(a)*r;
    p.x=lerp(p.x,targetX,0.085);p.y=lerp(p.y,targetY,0.085);p.set=Math.max(p.set,0.82);
    if(h.age>=h.life){delete p.hermetic;continue;}
    hermetic.push({p,a,wx:tx+p.x,wy:ty+p.y});
  }
  hermetic.sort((a,b)=>a.a-b.a);

  const captured=heart.sparks.reduce((n,s)=>n+(s.cap?1:0),0);
  const coreMatter=(heart.skirt||[]).length+captured*2;
  bondSeen =lerp(bondSeen,near?Math.min(1,coreMatter/8):0,0.03);
  bondAlone=lerp(bondAlone,Math.min(1,hermetic.length/7),0.03);

  if(bondSeen>0.04&&near){
    /* TEMPLE·HEART uses only real nearby law. No decorative proxy diamonds. */
    const cand=[];
    for(const p of temple.pts){
      if(p.rot>0||p.hermetic)continue;
      const wx=tx+p.x,wy=ty+p.y,dd=(wx-hx)**2+(wy-hy)**2;
      if(dd<170*170)cand.push({wx,wy,dd});
    }
    cand.sort((a,b)=>a.dd-b.dd);
    for(let k=0;k<Math.min(4,cand.length);k++){
      const c=cand[k],mx=(c.wx+hx)/2,my=(c.wy+hy)/2;
      const px2=-(hy-c.wy)*0.22,py2=(hx-c.wx)*0.22;
      X.strokeStyle='rgba(100,150,255,'+(0.24*bondSeen*(1-k*0.18))+')';X.lineWidth=0.9;
      X.beginPath();X.moveTo(c.wx,c.wy);X.quadraticCurveTo(mx+px2,my+py2,hx,hy);X.stroke();
    }
  }

  if(hermetic.length){
    /* HEART·TEMPLE is a boundary made of the actual struck nodes. Red acts;
       blue closes around an inside; magenta remains only at the seam. */
    if(hermetic.length>1){
      X.strokeStyle='rgba(90,135,255,'+(0.20+0.22*bondAlone)+')';X.lineWidth=0.85;
      X.beginPath();X.moveTo(hermetic[0].wx,hermetic[0].wy);
      for(let i=1;i<hermetic.length;i++)X.lineTo(hermetic[i].wx,hermetic[i].wy);
      if(hermetic.length>3)X.lineTo(hermetic[0].wx,hermetic[0].wy);X.stroke();
    }
    for(const h of hermetic){
      X.strokeStyle='rgba(205,75,225,'+(0.10+0.16*bondAlone)+')';X.lineWidth=0.55;
      X.beginPath();X.moveTo(hx,hy);X.lineTo(h.wx,h.wy);X.stroke();
    }
  }
}

        /* Judgment is paid for with four real circles of her dress. She must
           be richly clothed before she can spend them and remain a goddess. */

/* ============ the two arrivals ============
   Neither is spawned. Each is a condition the world can enter, and when the
   condition holds the figure is simply there. Neither is named on screen.

   THE BRIDE (GREEN·BLUE) — she comes when sight and law have been in contact
   long enough for the contact itself to become a thing: green fully dressed in
   ice, standing in a well-grown lattice, beheld. She is absolute sound, so what
   she does is make the two agree — while she stands, ice does not melt and the
   law grows freely, and the glints of the cooling gather to her instead of
   dispersing.

   THE AGGRESSOR (HEART·LOVE·POWER) — three colors in sequence, so a transit,
   not a state. She requires what the bride does not: fire, sight, and rot all
   present at strength, with law scarce. She does not preserve. She takes what
   is turning and spends it. */
const bride={on:false,x:0,y:0,t:0,cool:0,life:0,age:0,dying:0,forced:0};
const aggressor={on:false,x:0,y:0,t:0,cool:0,vx:0,vy:0,target:null,life:0,age:0,dying:0,cuts:[],forced:0};

/* ---- the names ----------------------------------------------------------

   she stands and is gone from it when she goes -- and nothing anywhere
   explains what the name means. That is the point: a player who runs this for
   an hour sees a word arrive in the list, and has only the figure itself to
   read it against.

const ARRIVAL_NAMES = {

                     '<span style="color:#0f0">tsu</span><span style="color:#00c8ff">ne</span>'},

};
/* ============ what is compound is mortal ============
   A single color is a primitive and cannot be taken apart. Anything wearing
   more than one color is a COMPOUND — a state or a transit — and every compound
   is temporary by construction, because it is held together only by the
   relation between its terms. So the multicolor goddesses come, hold for a
   while, and DIE; and dying, they do not vanish, they DECOMPOSE. What is left
   is one of the colors that made them, returned to the world as itself.
   POWER's non-persistence is the same law seen from underneath. */
function decompose(x,y,parts,strength){
  /* the terms come apart and go their separate ways */
  for(const c of parts){
    for(let k=0;k<Math.max(2,Math.round(5*strength));k++){
      const an=rand(0,TAU), sp=rand(0.6,2.2);
      if(c==='green'){
        golds.push({x,y,age:0,life:rand(120,210),vy:-rand(0.3,0.9),vx:rand(-0.5,0.5)});
      }else if(c==='blue'){
        skirtRain.push({x:x+rand(-8,8),y:y+rand(-8,8),vx:Math.cos(an)*sp*0.5,
          vy:Math.sin(an)*sp*0.4,age:0,life:rand(70,140),ice:true});
      }else if(c==='red'){
        heart.sparks.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,age:0,life:rand(120,240)});
      }else if(c==='pink'){
        magentas.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,age:0,life:rand(50,110)});
      }
    }
    addElementImpact(c==='green'?'love':c==='blue'?'ice':c==='red'?'heart':'power',x,y,0.5*strength);
  }
}

    aggressor.x+=aggressor.vx;aggressor.y+=aggressor.vy;
    if(d<40*T.scale+18){
      T.energy=Math.max(0.2,T.energy-0.035);T.shock=1;
      if(tick%6===0){
        addElementImpact('power',T.x+rand(-20,20),T.y+rand(-20,20),0.3);
        const an=rand(0,TAU);
        heart.sparks.push({x:aggressor.x,y:aggressor.y,vx:Math.cos(an)*2.4,vy:Math.sin(an)*2.4,age:0,life:rand(90,170)});
      }
      /* A cut used to be over in the frame it happened, which made the most
         violent thing in the world the least visible one. Each strike now
         leaves a cut that OPENS -- a bright line that lengthens, thins and
         cools over a second and a half, in one of her three colours. Spending
         is supposed to look like spending. */
      if(tick%9===0){
        const ca=Math.atan2(T.y-aggressor.y,T.x-aggressor.x)+rand(-0.5,0.5);
        aggressor.cuts.push({x:lerp(aggressor.x,T.x,0.55)+rand(-14,14),
                             y:lerp(aggressor.y,T.y,0.55)+rand(-14,14),
                             a:ca,age:0,life:rand(64,96),c:(Math.random()*3)|0,
                             len:rand(46,104)});
      }
    }
  }
  const a=aggressor.t;
  X.save();X.globalCompositeOperation='lighter';
  /* the cuts, drawn under her so she stays the brightest thing present */
  for(let ci=aggressor.cuts.length-1;ci>=0;ci--){
    const c=aggressor.cuts[ci];
    c.age+=Math.max(1,Math.round(pace*0.5));
    if(c.age>c.life){aggressor.cuts.splice(ci,1);continue;}
    const q=c.age/c.life, open=Math.min(1,q*3.2), fade=(1-q)*(1-q);
    const col=c.c===0?'rgba(255,60,40,':c.c===1?'rgba(110,255,140,':'rgba(255,80,205,';
    const L=c.len*open, ux=Math.cos(c.a), uy=Math.sin(c.a);
    X.strokeStyle=col+(0.55*fade*a)+')';
    X.lineWidth=2.6*fade+0.4;
    X.beginPath();
    X.moveTo(c.x-ux*L*0.5,c.y-uy*L*0.5);
    X.lineTo(c.x+ux*L*0.5,c.y+uy*L*0.5);
    X.stroke();
    /* the wound has an edge: a thin white core that closes first */
    X.strokeStyle='rgba(255,240,235,'+(0.34*fade*fade*a)+')';
    X.lineWidth=0.9;
    X.beginPath();
    X.moveTo(c.x-ux*L*0.34,c.y-uy*L*0.34);
    X.lineTo(c.x+ux*L*0.34,c.y+uy*L*0.34);
    X.stroke();
  }
  /* three bodies in one figure, never resolving into a single hue */
  const ph=tick*0.05;
  const trio=[['rgba(255,40,30,',0],['rgba(90,255,120,',TAU/3],['rgba(255,90,200,',TAU*2/3]];
  for(const [col,off] of trio){
    const ox=aggressor.x+Math.cos(ph+off)*11, oy=aggressor.y+Math.sin(ph+off)*11;
    let tg=X.createRadialGradient(ox,oy,0,ox,oy,26);
    tg.addColorStop(0,col+(0.55*a)+')');
    tg.addColorStop(1,col+'0)');
    X.fillStyle=tg;X.beginPath();X.arc(ox,oy,26,0,TAU);X.fill();
  }
  /* the blades: her regard is not a beam but a set of cuts */
  for(let k=0;k<3;k++){
    const an=ph*1.7+k*TAU/3, len=44+18*Math.sin(tick*0.08+k);
    const col=k===0?'rgba(255,60,40,':k===1?'rgba(110,255,140,':'rgba(255,80,205,';
    X.strokeStyle=col+(0.32*a)+')';X.lineWidth=1.4;
    X.beginPath();
    X.moveTo(aggressor.x+Math.cos(an)*10,aggressor.y+Math.sin(an)*10);
    X.lineTo(aggressor.x+Math.cos(an)*len,aggressor.y+Math.sin(an)*len);
    X.stroke();
  }
  X.restore();
}

/* torn skirt-law falls as blue rain, and where it lands near the temple,
   it anchors — the law cycling home */
/* MAGENTA IS A RELATION, NOT A PRIMARY.
   Red and blue are receptors; magenta is the eye's verdict on their sum, which
   is why it has no wavelength. So it may never be simply drawn — it must be
   produced, here, by red and blue actually meeting. These motes are that
   verdict. Alone each fades to nothing, because a relation with only one term
   is not a relation. But where enough of them coincide, the relation has been
   asserted often enough to become a thing that turns: a gyre. POWER is derived,
   and this is the derivation. */
const magentas=[];
function updateMagentas(){
  for(let i=magentas.length-1;i>=0;i--){
    const m=magentas[i]; m.age++;
    const _m=mo(); m.x+=m.vx*_m; m.y+=m.vy*_m; m.vx*=damp(0.97); m.vy*=damp(0.97);
    if(m.age>m.life){magentas.splice(i,1);continue;}
    const a=1-m.age/m.life;
    /* #ff00ff, honestly: full red and full blue, no green at all */
    X.save(); X.globalCompositeOperation='lighter';
    let g=X.createRadialGradient(m.x,m.y,0,m.x,m.y,7);
    g.addColorStop(0,'rgba(255,0,255,'+(0.55*a)+')');
    g.addColorStop(1,'rgba(255,0,255,0)');
    X.fillStyle=g; X.beginPath(); X.arc(m.x,m.y,7,0,TAU); X.fill();
    X.fillStyle='rgba(255,90,255,'+(0.7*a)+')';
    X.beginPath(); X.arc(m.x,m.y,1.3*a+0.4,0,TAU); X.fill();
    X.restore();
  }
  /* enough coincident assertions and the relation stands up on its own */
  if(tick%30===0&&magentas.length>=22&&gyres.length<4){
    let cx=0,cy=0;
    for(const m of magentas){cx+=m.x;cy+=m.y;}
    cx/=magentas.length;cy/=magentas.length;
    let tight=0;
    for(const m of magentas)if((m.x-cx)**2+(m.y-cy)**2<110*110)tight++;
    if(tight>=18){
      gyres.push(makeGyre(cx,cy,rand(0.35,0.55),false));
      addElementImpact('power',cx,cy,0.9);
      sfx('devour');
      magentas.length=0;
    }
  }
}

/* GREEN·BLUE, the debt paid: cooling does not destroy heat, it displaces it.
   When sight freezes a circle of law, the heat that left has nowhere to go and
   escapes as glints — scattered photons thrown outward from the lattice edge,
   briefly visible, then gone. They are not particles of anything; they are the
   fact that the ledger balances. */
const glints=[];
function emitGlints(wx,wy,tx,ty,n){
  /* the heat leaves along the outward normal of the lattice — away from the
     seat of law, since that is the direction in which there is room */
  const ax=wx-tx, ay=wy-ty, ad=Math.hypot(ax,ay)||1;
  for(let k=0;k<(n||3);k++){
    const spread=rand(-0.9,0.9);
    const a=Math.atan2(ay,ax)+spread;
    const sp=rand(0.9,2.4);
    glints.push({x:wx,y:wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      age:0,life:rand(18,40),warm:Math.random()});
  }
}
function updateGlints(){
  for(let i=glints.length-1;i>=0;i--){
    const g=glints[i]; g.age++;
    const _m=mo(); g.x+=g.vx*_m; g.y+=g.vy*_m; g.vx*=damp(0.93); g.vy*=damp(0.93);
    if(g.age>g.life){glints.splice(i,1);continue;}
    const a=1-g.age/g.life;
    /* they leave as light, not as fire: near-white with a faint warm cast,
       because what is departing is the heat the ice no longer holds */
    X.save(); X.globalCompositeOperation='lighter';
    X.fillStyle=g.warm>0.5
      ? 'rgba(255,248,220,'+(0.85*a*a)+')'
      : 'rgba(210,255,250,'+(0.80*a*a)+')';
    X.beginPath(); X.arc(g.x,g.y,1.15*a+0.35,0,TAU); X.fill();
    if(a>0.55){
      X.strokeStyle='rgba(255,255,240,'+(0.30*a)+')'; X.lineWidth=0.45;
      X.beginPath(); X.moveTo(g.x-g.vx*2.2,g.y-g.vy*2.2); X.lineTo(g.x,g.y); X.stroke();
    }
    X.restore();
  }
}
const skirtRain=[];
function updateSkirtRain(){
  for(let i=skirtRain.length-1;i>=0;i--){
    const d=skirtRain[i]; d.age++;
    d.vy+=0.05; d.x+=d.vx; d.y+=d.vy; d.vx*=0.99;
    const a=1-d.age/d.life;

    }
  }
}
/* ============ sound: only for what matters ============ */
let AC=null, sndOn=true;
function audioInit(){ if(AC||!sndOn)return; try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
addEventListener('pointerdown',audioInit); addEventListener('keydown',audioInit);
function tone(freq,dur,type,vol,delay,glide){
  if(!AC||!sndOn)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.06,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function sfx(name){
  if(!AC||!sndOn)return;
  if(name==='impact'){ tone(72,1.4,'sine',0.09,0,40); tone(1900,0.9,'triangle',0.022,0.03,600); }
  else if(name==='devour'){ tone(300,1.1,'sawtooth',0.03,0,55); }
  else if(name==='ahika'){ tone(1560,0.7,'sine',0.045); tone(2340,1.1,'sine',0.028,0.12); }
  else if(name==='goddess'){ tone(523,1.2,'sine',0.04); tone(659,1.2,'sine',0.035,0.08); tone(784,1.6,'sine',0.03,0.16); }
  else if(name==='petrify'){ tone(980,0.5,'square',0.018,0,240); tone(140,0.9,'sine',0.055,0.1); }
}
/* STARFALL: keeping rises gently; what returns strikes without preference. */
function starImpact(x,y,hx,hy,tx,ty,energy){
  /* what the descent already spent, the landing cannot spend again */
  energy=Math.max(0,Math.min(1,energy==null?1:energy));
  sfx('impact');
  const blastScale=0.18+0.82*Math.sqrt(energy);
  const R=140*blastScale, R2=R*R;
  /* Matter created by this impact must not be erased by that same impact. */
  const goldStart=golds.length, emberStart=embers.length;
  const debris=[];
  for(let k=0;k<Math.max(6,Math.floor(44*(0.12+0.88*energy)));k++){
    const an=rand(0,TAU), sp=rand(1.1,6.8)*Math.pow(Math.random(),0.34);
    const kind=Math.random()<0.62?'needle':'shard';
    debris.push({x:0,y:0,px:0,py:0,
      vx:Math.cos(an)*sp+rand(-0.35,0.35),vy:Math.sin(an)*sp+rand(-0.35,0.35),
      drag:rand(0.958,0.986),sz:rand(0.45,2.0),warm:Math.random(),kind,
      stretch:kind==='needle'?rand(2.8,7.2):rand(1.1,2.4),rot:an+rand(-0.4,0.4),
      spin:kind==='shard'?rand(-0.18,0.18):rand(-0.025,0.025),gravity:rand(0.006,0.024)});
  }
  const facets=[];
  for(let k=0;k<Math.max(2,Math.ceil(5*blastScale));k++)
    facets.push({an:rand(0,TAU),reach:rand(0.48,1.02),spread:rand(0.025,0.095),skew:rand(-0.18,0.18),warm:Math.random()});
  const edge=[];for(let k=0;k<24;k++)edge.push(rand(0.72,1.08));
  starBursts.push({x,y,age:0,life:132,debris,facets,edge,maxR:168*blastScale});

  /* Even green can be struck: the impact tears a radiant hole through the
     permanent record rather than treating LOVE's sediment as exempt. */
  const eraseImpact=(ctx,cx,cy,r)=>{
    ctx.save();ctx.globalCompositeOperation='destination-out';
    const cut=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    cut.addColorStop(0,'rgba(0,0,0,0.98)');
    cut.addColorStop(0.48,'rgba(0,0,0,0.72)');
    cut.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cut;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();ctx.restore();
  };
  eraseImpact(PX,x,y,R);eraseImpact(SX,x,y,R);

  let sparkHits=0;
  for(let i=heart.sparks.length-1;i>=0;i--){
    const s=heart.sparks[i];
    if((s.x-x)**2+(s.y-y)**2<R2){
      /* gold × red: fire is not merely erased — much of it is transmuted upward */
      if(Math.random()<0.45) golds.push({x:s.x,y:s.y,age:0,life:rand(120,200),vy:-rand(0.5,1.0)});
      else if(sparkHits++<10) addElementImpact('heart',s.x,s.y,0.20);
      heart.sparks.splice(i,1);
    }
  }
  for(let i=daughters.length-1;i>=0;i--){
    const h=daughters[i];
    if((h.x-x)**2+(h.y-y)**2<R2*0.72){
      addElementImpact('heart',h.x,h.y,0.72);scatterLawSkirt(h,h.x,h.y,0.42,1);
      golds.push({x:h.x,y:h.y,age:0,life:rand(140,220),vy:-rand(0.6,1.1)}); /* her fire returns to the sky */
      PX.fillStyle='rgba(125,34,18,0.72)';
      PX.beginPath(); PX.arc(h.x,h.y,5.5,0,TAU); PX.fill();
      daughters.splice(i,1);
    }
  }
  if((hx-x)**2+(hy-y)**2<R2){
    heart.shock=1;addElementImpact('heart',hx,hy,1.25);scatterLawSkirt(heart,hx,hy,1.05,0.42);
    heart.rings.push({r:8,a:1.8});
    for(let k=0;k<18;k++){
      const a=rand(0,TAU), sp=rand(2.2,5.2);
      heart.sparks.push({x:hx,y:hy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:80,life:rand(100,180)});
    }
  }

  const ldx=love.x-x, ldy=love.y-y, ld=Math.hypot(ldx,ldy);
  if(ld<R){
    const a=ld>1?Math.atan2(ldy,ldx):rand(0,TAU);
    const force=5.5*(1-ld/R)+1.2;
    love.hitVx+=Math.cos(a)*force; love.hitVy+=Math.sin(a)*force;
    love.gazeTarget+=Math.PI+rand(-0.8,0.8); love.shock=1;addElementImpact('love',love.x,love.y,1.15);
    love.stun=dur(170); love.guard=dur(1800); /* even green: the criterion goes dark awhile */
    for(let k=0;k<8;k++) /* gold × green: overwhelmed sight still begets light */
      golds.push({x:love.x+rand(-26,26),y:love.y+rand(-20,20),age:0,life:rand(120,220),vy:-rand(0.5,1.1)});
  }

  const TR2=(104*blastScale)**2, brkCap=Math.floor(30*energy);
  let broken=0;
  for(let i=temple.pts.length-1;i>=0&&temple.pts.length>3;i--){
    const p=temple.pts[i], wx=tx+p.x, wy=ty+p.y;
    if((wx-x)**2+(wy-y)**2<TR2 && broken<brkCap){addElementImpact('temple',wx,wy,0.24);temple.pts.splice(i,1);broken++;}
  }
  if(broken){temple.shock=1;addElementImpact('temple',tx,ty,Math.min(1.2,0.35+broken/26));}
  /* gold × blue: struck deep enough, the law closes around the light and KEEPS
     it. The threshold is a PROPORTION of what the blast could possibly break,
     not a fixed count: when the lattice loosened, eight circles inside the
     strike radius stopped being a deep wound and became an impossible one, and
     kept light quietly stopped happening. What matters is that the law was
     broken open, not how many circles that took. */
  const deepEnough=Math.max(3,Math.min(8,Math.round(brkCap*TUNE.AHIKA_DEEP_FRAC)));
  if(broken>=deepEnough&&Math.random()<TUNE.AHIKA_KEEP){
    const seat=chooseKeptSeat(false);
    embers.push({x:seat.x,y:seat.y,ph:rand(0,TAU),kind:'star',scale:1,skirt:[]});
    addElementImpact('star',tx+seat.x,ty+seat.y,0.9);
    sfx('ahika');
  }
  for(let i=emberStart-1;i>=0;i--){
    const e=embers[i];
    if((tx+e.x-x)**2+(ty+e.y-y)**2<TR2){
      if(e.kind==='goddess'){scatterLawSkirt(e,tx+e.x,ty+e.y-3*(e.scale||1),0.62*(e.scale||1),1);addElementImpact('goddess',tx+e.x,ty+e.y,1.35);}
      else addElementImpact(e.kind==='star'?'star':'heart',tx+e.x,ty+e.y,0.55);
      embers.splice(i,1);
    }
  }

  for(const G of gyres){
    const gd=Math.hypot(G.x-x,G.y-y);
    if(gd<150*G.scale+80){
      G.shock=1;addElementImpact('power',G.x,G.y,G.root?1.25:0.82);
      if(!G.root)G.age=G.life+1;
      else G.energy=Math.max(0.28,G.energy*0.35);
    }
    let orbitHits=0;
    for(const o of G.orbiters){
      const ox=G.x+Math.cos(o.a)*o.r, oy=G.y+Math.sin(o.a)*o.r;
      if((ox-x)**2+(oy-y)**2<R2){
        if(orbitHits++<8)addElementImpact('power',ox,oy,0.20);
        /* thrown through the whole band, never piled at the rim */
        o.r=rand(38,100)*G.scale; o.a=rand(0,TAU); o.blessed=0; o.fresh=true;
      }
    }
    for(let i=G.out.length-1;i>=0;i--){
      const q=G.out[i]; if((q.x-x)**2+(q.y-y)**2<R2)G.out.splice(i,1);
    }
  }
  for(let i=goldStart-1;i>=0;i--){
    const m=golds[i];if((m.x-x)**2+(m.y-y)**2<R2)golds.splice(i,1);
  }
  for(let i=ferments.length-1;i>=0;i--){
    const m=ferments[i];if((m.x-x)**2+(m.y-y)**2<R2)ferments.splice(i,1);
  }
}
function drawStarBursts(){
  for(let i=starBursts.length-1;i>=0;i--){
    const b=starBursts[i]; b.age+=Math.max(1,Math.round(pace*0.5));
    if(b.age>b.life){starBursts.splice(i,1);continue;}
    const q=b.age/b.life, a=(1-q)*(1-q);
    /* The blast no longer expands linearly. Real release is fast then stalls:
       the front decelerates as it does work on the field it moves into. */
    const ease=1-Math.pow(1-q,2.6);
    const r=16+ease*(b.maxR||205);
    X.save(); X.globalCompositeOperation='lighter';

    /* 1. THE FLASH — brief, nearly white, over in a few frames. It is not the
       explosion; it is the moment before the explosion is legible. */
    if(q<0.13){
      const fa=Math.pow(1-q/0.13,2);
      let fg=X.createRadialGradient(b.x,b.y,0,b.x,b.y,r*0.85);
      fg.addColorStop(0,'rgba(255,255,255,'+(0.95*fa)+')');
      fg.addColorStop(0.4,'rgba(255,252,225,'+(0.55*fa)+')');
      fg.addColorStop(1,'rgba(255,230,170,0)');
      X.fillStyle=fg;X.beginPath();X.arc(b.x,b.y,r*0.85,0,TAU);X.fill();
    }

    /* 2. THE THERMAL CORE — a fractured perimeter, hot center, steep falloff.
       It cools through its colors instead of merely fading: white to gold to
       ember, so the eye reads temperature dropping rather than opacity. */
    const edge=b.edge&&b.edge.length?b.edge:Array.from({length:24},(_,j)=>0.82+0.16*Math.sin(j*2.17+b.x*0.013+b.y*0.009));
    X.save();X.beginPath();
    for(let j=0;j<edge.length;j++){
      const an=j*TAU/edge.length;
      /* the perimeter roughens as it expands: instability grows with radius */
      const wob=1+(edge[j]-0.9)*(0.5+1.5*q);
      const er=r*edge[j]*wob;
      const ex=b.x+Math.cos(an)*er,ey=b.y+Math.sin(an)*er;
      if(j===0)X.moveTo(ex,ey);else X.lineTo(ex,ey);
    }
    X.closePath();X.clip();
    const cool=Math.min(1,q*1.5);
    let g=X.createRadialGradient(b.x,b.y,0,b.x,b.y,r*1.08);
    g.addColorStop(0,'rgba('+Math.floor(lerp(255,255,cool))+','+Math.floor(lerp(255,150,cool))+','+Math.floor(lerp(240,40,cool))+','+Math.min(1,2.2*a)+')');
    g.addColorStop(0.10,'rgba(255,'+Math.floor(lerp(248,120,cool))+','+Math.floor(lerp(145,20,cool))+','+(0.92*a)+')');
    g.addColorStop(0.34,'rgba('+Math.floor(lerp(255,190,cool))+','+Math.floor(lerp(138,40,cool))+',30,'+(0.42*a)+')');
    g.addColorStop(1,'rgba(150,12,0,0)');
    X.fillStyle=g;X.fillRect(b.x-r*1.15,b.y-r*1.15,r*2.3,r*2.3);X.restore();

    /* 3. THE SHOCK — a thin front that outruns the light and thins as it goes.
       This is what makes an impact read as an event with a boundary. */
    if(q<0.62){
      const sr=r*1.16, sa=Math.pow(1-q/0.62,1.7);
      X.strokeStyle='rgba(255,242,205,'+(0.40*sa)+')';
      X.lineWidth=Math.max(0.4,2.6*sa);
      X.beginPath();
      for(let j=0;j<=edge.length;j++){
        const jj=j%edge.length, an=jj*TAU/edge.length;
        const er=sr*(0.94+(edge[jj]-0.9)*0.7);
        const ex=b.x+Math.cos(an)*er,ey=b.y+Math.sin(an)*er;
        if(j===0)X.moveTo(ex,ey);else X.lineTo(ex,ey);
      }
      X.closePath();X.stroke();
    }

    /* A few unequal wedges break from the light. They are neither a regular
       ring nor symmetrical spokes: each has its own reach, skew, and heat. */
    for(const f of b.facets||[]){
      const root=Math.min(18,r*0.12),tip=r*(0.58+0.48*f.reach),an=f.an+f.skew*q;
      const bx=b.x+Math.cos(an)*root,by=b.y+Math.sin(an)*root;
      const tx2=b.x+Math.cos(an)*tip,ty2=b.y+Math.sin(an)*tip;
      const side=Math.max(1.2,tip*f.spread);
      const nx=-Math.sin(an)*side,ny=Math.cos(an)*side;
      const fg=X.createLinearGradient(bx,by,tx2,ty2);
      fg.addColorStop(0,'rgba(255,248,180,'+(0.38*a)+')');
      fg.addColorStop(0.42,f.warm>0.5?'rgba(255,178,48,'+(0.24*a)+')':'rgba(255,78,24,'+(0.20*a)+')');
      fg.addColorStop(1,'rgba(255,30,0,0)');
      X.fillStyle=fg;X.beginPath();X.moveTo(bx+nx,by+ny);X.lineTo(tx2,ty2);X.lineTo(bx-nx*0.55,by-ny*0.55);X.closePath();X.fill();
    }

    /* 4. THE SMOLDER — after the light has gone the ground stays warm. A dim
       ember field that outlives the blast and fades without expanding. */
    if(q>0.35){
      const sa=Math.sin(Math.min(1,(q-0.35)/0.65)*Math.PI)*0.5;
      let mg=X.createRadialGradient(b.x,b.y,0,b.x,b.y,r*0.55);
      mg.addColorStop(0,'rgba(255,88,26,'+(0.20*sa)+')');
      mg.addColorStop(1,'rgba(120,10,0,0)');
      X.fillStyle=mg;X.beginPath();X.arc(b.x,b.y,r*0.55,0,TAU);X.fill();
    }

    for(const d of b.debris||[]){
      d.px=d.x; d.py=d.y; d.x+=d.vx; d.y+=d.vy;
      d.vx*=d.drag; d.vy=d.vy*d.drag+(d.gravity==null?0.008:d.gravity);d.rot=(d.rot||0)+(d.spin||0);
      /* ejecta cools as it flies and sheds what it cannot hold */
      if(q>0.2&&q<0.8&&Math.random()<0.012)
        golds.push({x:b.x+d.x,y:b.y+d.y,age:0,life:rand(60,120),vy:-rand(0.2,0.6),vx:rand(-0.3,0.3)});
      const da=Math.max(0,a*(0.34+0.66*d.warm));
      const kind=d.kind||'needle',speed=Math.max(0.3,Math.hypot(d.vx,d.vy)),an=kind==='needle'?Math.atan2(d.vy,d.vx):(d.rot||0);
      X.save();X.translate(b.x+d.x,b.y+d.y);X.rotate(an);
      if(kind==='shard'){
        const sz=d.sz*(0.7+0.65*a),stretch=d.stretch||1.6;
        X.fillStyle=d.warm>0.58?'rgba(255,230,125,'+(0.78*da)+')':'rgba(255,82,26,'+(0.66*da)+')';
        X.beginPath();X.moveTo(sz*stretch,0);X.lineTo(-sz*0.45,sz*0.72);X.lineTo(-sz*1.05,-sz*0.18);X.lineTo(sz*0.12,-sz*0.54);X.closePath();X.fill();
        X.strokeStyle='rgba(255,252,214,'+(0.34*da)+')';X.lineWidth=0.4;X.stroke();
      }else{
        const len=Math.max(2.5,speed*(d.stretch||4.2)*(0.48+0.72*a)),wid=Math.max(0.35,d.sz*(0.30+0.42*a));
        X.fillStyle=d.warm>0.56?'rgba(255,247,168,'+(0.82*da)+')':'rgba(255,100,28,'+(0.68*da)+')';
        X.beginPath();X.moveTo(len*0.30,0);X.lineTo(-len*0.70,wid);X.lineTo(-len,-wid*0.24);X.lineTo(-len*0.55,-wid);X.closePath();X.fill();
      }
      X.restore();
