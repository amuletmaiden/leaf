}
/* ============ STARSTRUCK ============
   To be passed closely by falling light is not nothing, and until now it was
   almost nothing -- a shock, a stun, over inside a second. Being starstruck is
   a CONDITION now, and it lasts: whoever the light went by is lit gold for a
   long while afterwards, sheds that gold as she goes, and leans toward the
   place the star came down. She saw where it went and she cannot help it.

   The four are tracked separately because they are struck differently and
   should be able to be struck at the same time. `at` remembers where the
   light was going, which is what the leaning is toward. */
const starstruck={heart:0,love:0,temple:0,power:0,at:null,ph:0};
function strike(who,x,y,strength){
  starstruck[who]=Math.max(starstruck[who]||0, dur(760*(strength||1)));
  starstruck.at={x,y};
  sfx('ahika');
}
function drawStarstruck(hx,hy,tx,ty,px,py){
  const where={heart:[hx,hy],love:[love.x,love.y],temple:[tx,ty],power:[px,py]};
  const rad={heart:34,love:26,temple:44,power:38};
  starstruck.ph+=0.05;
  let any=false;
  for(const who of ['heart','love','temple','power']){
    let t=starstruck[who]||0;
    if(t<=0)continue;
    any=true;
    t-=Math.max(1,Math.round(pace*0.5));
    starstruck[who]=t>0?t:0;
    const [wx,wy]=where[who];
    const q=Math.min(1,t/300), pulse=0.62+0.38*Math.sin(starstruck.ph+wx*0.01);
    const r=rad[who]*(1.25+0.22*pulse);
    X.save(); X.globalCompositeOperation='lighter';
    let g=X.createRadialGradient(wx,wy,r*0.15,wx,wy,r);
    g.addColorStop(0,'rgba(255,242,180,'+(0.30*q*pulse)+')');
    g.addColorStop(0.55,'rgba(255,222,120,'+(0.13*q)+')');
    g.addColorStop(1,'rgba(255,206,90,0)');
    X.fillStyle=g; X.beginPath(); X.arc(wx,wy,r,0,TAU); X.fill();
    X.restore();
    /* it sheds what struck it */
    if(Math.random()<0.16*q)
      golds.push({x:wx+rand(-r*0.6,r*0.6),y:wy+rand(-r*0.5,r*0.5),
        age:0,life:rand(120,220),vy:-rand(0.3,0.8),vx:rand(-0.4,0.4)});
  }
  /* and green, being sight, actually goes after it */
  if((starstruck.love||0)>0 && starstruck.at && love.stun===0){
    const dx=starstruck.at.x-love.x, dy=starstruck.at.y-love.y;
    const d=Math.hypot(dx,dy)||1;
    if(d>60){ love.x+=dx/d*0.16*mo(); love.y+=dy/d*0.16*mo(); }
  }
  if(!any)starstruck.at=null;
}

function starTouchesWorld(f,x,y,hx,hy,tx,ty){
  if(!f.hit)f.hit={};
  if(f.energy==null)f.energy=1;
  const spend=(c)=>{f.energy=Math.max(0,f.energy-c);};
  const near=(ax,ay,r)=>f.energy>0&&(ax-x)**2+(ay-y)**2<r*r;
  /* A core interception and a later spatial skirt pass are two views of the
     same contact. Remember the owner so one star cannot charge it twice in a
     single frame. */
  const shieldedOwners=new Set();
  if(!f.hit.heart&&near(hx,hy,26)){
    f.hit.heart=1;
    if((heart.skirt||[]).length>2){
      /* the dress meets the light first: gathered law spent as shield */
      const torn=spendLawSkirt(heart,hx,hy,1.05,Math.min(3,heart.skirt.length));
      spend(0.035*torn);shieldedOwners.add(heart);
      addElementImpact('temple',hx,hy+10,0.5);
    } else {
      heart.shock=1;addElementImpact('heart',hx,hy,0.82);scatterLawSkirt(heart,hx,hy,1.05,0.24);
      spend(0.12); strike('heart',f.tx,f.ty,1.0);
    }
  }
  if(!f.hit.love&&near(love.x,love.y,20)){
    f.hit.love=1;love.shock=1;love.hitVx+=(love.x-x)*0.12;love.hitVy+=(love.y-y)*0.12;addElementImpact('love',love.x,love.y,0.84);
    love.stun=Math.max(love.stun,dur(90)); /* dazzled by the passing light */
    strike('love',f.tx,f.ty,1.25); /* and she stays dazzled: see STARSTRUCK */
    spend(0.10);
    for(let k=0;k<4;k++)golds.push({x:love.x+rand(-18,18),y:love.y+rand(-14,14),age:0,life:rand(110,190),vy:-rand(0.4,0.9)});
  }
  if(f.energy>0&&!f.hit.gaze&&inGaze(x,y,0.13)){
    /* the beam crossing raw radiance: a flare of gold where they touch, the aim jarred */
    f.hit.gaze=1;love.shock=Math.max(love.shock,0.5);love.gazeTarget+=rand(-0.65,0.65);addElementImpact('love',x,y,0.48);
    for(let k=0;k<3;k++)golds.push({x:x+rand(-10,10),y:y+rand(-10,10),age:0,life:rand(100,170),vy:-rand(0.4,0.8)});
  }
  if(!f.hit.temple&&near(tx,ty,24)){
    f.hit.temple=1;temple.shock=1;addElementImpact('temple',tx,ty,0.88);spend(0.08);
  }

  for(let i=daughters.length-1;i>=0;i--){
    const h=daughters[i];if(near(h.x,h.y,11)){
      if((h.skirt||[]).length>2){
        const torn=spendLawSkirt(h,h.x,h.y,0.42,Math.min(2,h.skirt.length));
        addElementImpact('temple',h.x,h.y+4,0.42);spend(0.035*torn);shieldedOwners.add(h);continue;
      }
      addElementImpact('heart',h.x,h.y,0.58);
      golds.push({x:h.x,y:h.y,age:0,life:rand(140,220),vy:-rand(0.6,1.1)}); /* her fire returns upward */
      daughters.splice(i,1);spend(0.10);
    }
  }
  for(let i=heart.sparks.length-1,cut=0;i>=0&&cut<4;i--){
    const s=heart.sparks[i];if(near(s.x,s.y,7)){addElementImpact('heart',s.x,s.y,0.16);heart.sparks.splice(i,1);cut++;spend(0.008);}
  }
  for(let i=temple.pts.length-1,cut=0;i>=0&&temple.pts.length>3&&cut<5;i--){
    const p=temple.pts[i],wx=tx+p.x,wy=ty+p.y;if(near(wx,wy,8)){
      temple.shock=Math.max(temple.shock,0.52);addElementImpact('temple',wx,wy,0.20);temple.pts.splice(i,1);cut++;spend(0.014);
    }
  }
  for(let i=embers.length-1;i>=0;i--){
    const e=embers[i],wx=tx+e.x,wy=ty+e.y;if(near(wx,wy,e.kind==='goddess'?17:9)){
      if(e.kind==='goddess'&&(e.skirt||[]).length>2){
        /* Her real law circles receive the descent before her red core does. */
        const torn=spendLawSkirt(e,wx,wy-3*(e.scale||1),0.62*(e.scale||1),Math.min(3,e.skirt.length));
        addElementImpact('goddess',wx,wy,0.72);spend(0.035*torn);shieldedOwners.add(e);continue;
      }
      if(e.kind==='goddess')addElementImpact('goddess',wx,wy,1);
      else addElementImpact(e.kind==='star'?'star':'heart',wx,wy,0.42);
      embers.splice(i,1);spend(e.kind==='goddess'?0.12:0.04);
    }
  }
  for(let gi=0;gi<gyres.length;gi++){
    const G=gyres[gi];
    if(!f.hit['power'+gi]&&near(G.x,G.y,22*G.scale+7)){
      f.hit['power'+gi]=1;G.shock=1;G.energy=Math.max(0.35,G.energy*0.58);addElementImpact('power',G.x,G.y,G.root?0.92:0.66);
      if(!G.root)G.age+=Math.floor(G.life*0.22);
      spend(0.12);
    }
    for(const o of G.orbiters){
      const ox=G.x+Math.cos(o.a)*o.r,oy=G.y+Math.sin(o.a)*o.r;
      if(near(ox,oy,6)){o.r+=rand(24,52);o.a+=rand(-0.4,0.4);o.blessed=0;o.fresh=true;addElementImpact('power',ox,oy,0.16);spend(0.006);}
    }
  }

  const skirts=[{o:heart,x:hx,y:hy,s:1.05}];
  for(const h of daughters)skirts.push({o:h,x:h.x,y:h.y,s:0.42});
  for(const e of embers)if(e.kind==='goddess')skirts.push({o:e,x:tx+e.x,y:ty+e.y-3*(e.scale||1),s:0.62*(e.scale||1)});
  for(const z of skirts){
    if(shieldedOwners.has(z.o))continue;
    const pts=lawSkirtPositions(z.x,z.y,z.s,z.o.skirt||[]);
    for(let i=pts.length-1;i>=0;i--)if(near(pts[i].x,pts[i].y,6)){
      addElementImpact('temple',pts[i].x,pts[i].y,0.18);
      skirtRain.push({x:pts[i].x,y:pts[i].y,vx:rand(-0.8,0.8),vy:rand(-0.6,0),age:0,life:rand(50,110),ice:pts[i].n&&pts[i].n.ice});
      z.o.skirt.splice(i,1);
      spend(0.03);
    }
  }
}
/* the sky is impartial among the living, but it does not waste its tithe on
   empty ground: what returns falls toward one of them, or very near. */
function launchFall(){
  if(!stars.length)return;
  /* Nothing calls a star down. One simply happens to be closest to a mass when
     its own drift can no longer carry it past — the fall is the end of an
     orbit, so the star that falls is the one already deepest in a well. */
  const [fhx,fhy]=pHeart();
  const cand=[[fhx,fhy],[love.x,love.y],[tPos.x,tPos.y]];
  for(const G of gyres)cand.push([G.x,G.y]);
  let best=-1,bd=1e9,bc=null;
  for(let i=0;i<stars.length;i++){
    for(const c of cand){
      const d=(c[0]-stars[i].x)**2+(c[1]-stars[i].y)**2;
      if(d<bd){bd=d;best=i;bc=c;}
    }
  }
  if(best<0)return;
  const st=stars.splice(best,1)[0];
  const fx=Math.min(W*0.94,Math.max(W*0.06,bc[0]+rand(-45,45)));
  const fy=Math.min(H*0.94,Math.max(H*0.06,bc[1]+rand(-45,45)));
  /* The star keeps the momentum it had. It was ALREADY MOVING -- the fall is
     the end of an orbit, not a summons, and the comment above has always said
     so even while the code lerped it along a straight line with a fixed upward
     hump. Its own velocity is the opening condition of the descent, and the
     wells do the rest. */
  const d0=Math.hypot(fx-st.x,fy-st.y)||1;
  /* It leaves SIDEWAYS. A star that merely drops toward its landing site is a
     stone; a star that departs across the field on its own momentum and is
     slowly bent down is a fall. The launch velocity is mostly tangential to
     the line it will eventually take, so the path is a long shallow curve
     rather than a plunge, and it crosses far more of the sky on the way. */
  const aim=Math.atan2(fy-st.y,fx-st.x);
  const side=aim+(Math.random()<0.5?1:-1)*rand(0.7,1.15);
  const sp=TUNE.FALL_SPEED*rand(0.85,1.3);
  fallers.push({sx:st.x,sy:st.y,tx:fx,ty:fy,t:0,energy:1,
    x:st.x,y:st.y,px:st.x,py:st.y,d0:d0,age:0,
    vx:(st.vx||0)*2.2+Math.cos(side)*sp,
    vy:(st.vy||0)*2.2+Math.sin(side)*sp,sz:st.sz||1,mass:st.mass||1});
}
function updateStarfall(hx,hy,tx,ty){
  if(every(TUNE.FALL_INTERVAL,601) && stars.length>TUNE.FALL_MIN_STARS)launchFall();
  for(let i=fallers.length-1;i>=0;i--){
    const f=fallers[i];
    /* gold × green: sight cherishes falling light — beheld, it falls slower,
       and its road turns to gold */
    const beheld=f.lx!==undefined&&inGaze(f.lx,f.ly,0.2);
    /* THE DESCENT IS INTEGRATED, NOT INTERPOLATED.
       It used to be a smoothstep along the straight line from birthplace to
       landing site, plus `-Math.sin(t*PI)*60` -- and because canvas y grows
       downward, that term threw every star UPWARD by sixty pixels at midpoint
       regardless of which way it was travelling. That is the toss.

       Now the faller carries velocity. Each step it is pulled by the same four
       masses that bend a star in orbit, loses a little to the medium, and goes
       where that puts it. Beheld, it is slowed rather than rescheduled -- sight
       cherishes falling light by making it take longer, which is the same claim
       the old code made and could not express. `f.t` survives as normalised
       progress so every downstream test that reads it still means something. */
    const steps=Math.max(1,Math.min(6,Math.round(pace)));
    const drag=beheld?0.978:TUNE.FALL_DRAG;
    for(let s=0;s<steps;s++){
      let ax=0, ay=0;
      const wells=[[hx,hy,1.0],[love.x,love.y,0.72],[tx,ty,0.9],[f.tx,f.ty,1.25]];
      for(const G of gyres)wells.push([G.x,G.y,0.85*G.scale*Math.min(1.6,G.energy)]);
      for(const w of wells){
        const dx=w[0]-f.x, dy=w[1]-f.y;
        const d2=Math.max(400,dx*dx+dy*dy), d=Math.sqrt(d2);
        const g=TUNE.FALL_GRAV*w[2]/d2;
        ax+=dx/d*g; ay+=dy/d*g;
      }
      f.vx=(f.vx+ax)*drag; f.vy=(f.vy+ay)*drag;
      const sp=Math.hypot(f.vx,f.vy);
      if(sp>9.5){ f.vx=f.vx/sp*9.5; f.vy=f.vy/sp*9.5; }
      f.x+=f.vx; f.y+=f.vy; f.age++;
    }
    const rem=Math.hypot(f.tx-f.x,f.ty-f.y);
    f.t=Math.max(0,Math.min(0.999,1-rem/f.d0));
    const x=f.x, y=f.y;
    f.lx=x; f.ly=y;
    if(beheld&&tick%9===0)
      golds.push({x:x+rand(-9,9),y:y+rand(-9,9),age:0,life:rand(100,170),vy:-rand(0.4,0.9)});
    /* gold × magenta: rot pulls at grace — the road bends, and close enough
       the tithe is stolen whole: devoured mid-fall, never landing */
    let eaten=false;
    for(const G of gyres){
      const gd=Math.hypot(G.x-x,G.y-y);
      if(gd<300*G.scale&&f.t>0.05){
        /* rot pulls at grace: the road bends because something is pulling on
           it, not because the destination was quietly rewritten */
        const bd=Math.max(30,gd);
        f.vx+=(G.x-x)/bd*0.09*G.scale; f.vy+=(G.y-y)/bd*0.09*G.scale;
      }
      if(gd<34*G.scale+8&&f.t>0.15){
        G.energy=Math.min(2.2,G.energy+0.9); G.shock=1;
        sfx('devour');
        addElementImpact('power',x,y,1.3);
        PX.fillStyle='rgba(90,15,80,0.5)';
        PX.beginPath(); PX.arc(x,y,4,0,TAU); PX.fill();
        fallers.splice(i,1); eaten=true; break;
      }
    }
    if(eaten)continue;
    /* gold × blue: passing ice refracts the descent into small white glints */
    if(tick%7===0){
      for(const p of temple.pts){
        if(p.kind!=='ice')continue;
        const wx=tx+p.x, wy=ty+p.y;
        if((wx-x)**2+(wy-y)**2<60*60){ addElementImpact('ice',wx,wy,0.15); break; }
      }
    }
    starTouchesWorld(f,x,y,hx,hy,tx,ty);
    /* golden descent */
    let g=X.createRadialGradient(x,y,0,x,y,14);
    g.addColorStop(0,'rgba(255,245,140,0.9)');
    g.addColorStop(1,'rgba(255,200,0,0)');
    X.fillStyle=g; X.beginPath(); X.arc(x,y,14,0,TAU); X.fill();
    X.strokeStyle='rgba(255,240,150,0.35)'; X.lineWidth=1;
    X.beginPath(); X.moveTo(f.px,f.py); X.lineTo(x,y); X.stroke();
    f.px=x; f.py=y;
    /* it lands where it ARRIVES, which is not always where it was aimed: a
       fall that misses keeps going, is bent again, and comes down somewhere
       the world chose. Only a fall that has wandered a very long time is
       finally set down, so nothing orbits forever. */
    const arrived = rem < 26+8*f.sz;
    if(arrived || f.age > TUNE.FALL_MAX_AGE ||
       f.x<-80||f.x>W+80||f.y<-80||f.y>H+80){
      const lx2=Math.min(W-6,Math.max(6,f.x)), ly2=Math.min(H-6,Math.max(6,f.y));
      starImpact(lx2,ly2,hx,hy,tx,ty,f.energy*Math.min(1.6,0.6+f.sz*0.5));
      fallers.splice(i,1);
    }
  }
  drawStarBursts();
  drawElementImpacts();
}
/* Stars are not one size with jitter. Mass follows a power law -- overwhelmingly
   small, occasionally enormous -- because that is how condensing matter actually
   distributes itself, and because a sky of identical lights is a texture rather
   than a population. The giants are the whole point: they are rare, they are
   obviously giants, and everything else reads as small BECAUSE they exist.
   Bounded Pareto between STAR_SZ_MIN and STAR_SZ_MAX. */
function starSize(){
  const lo=TUNE.STAR_SZ_MIN, hi=TUNE.STAR_SZ_MAX, k=TUNE.STAR_SZ_ALPHA;
  const u=Math.random();
  const s=lo/Math.pow(1-u*(1-Math.pow(lo/hi,k)),1/k);
  return Math.min(hi,s);
}
function makeStar(x,y,vx,vy){
  const a=rand(0,TAU),d=rand(0.05,0.28);
  const sz=starSize();
  /* a heavy star drifts less and beats slower: mass shows in behaviour, not
     only in width */
  return {x,y,vx:((vx||0)+Math.cos(a)*d)/(0.7+sz*0.4),
          vy:((vy||0)+Math.sin(a)*d)/(0.7+sz*0.4),
    ph:rand(0,TAU),sp:rand(0.02,0.06)/(0.6+sz*0.6),sz:sz,mass:0.5+sz*0.9};
}
/* There is no top in space, and no star is summoned anywhere. Each drifts on
   the momentum it was born with and is bent only by the four masses: heart,
   sight, law, and the turning. Attraction, not attachment — a star that falls
   through a well leaves the other side and keeps going. */
function updateStars(hx,hy,tx,ty){
  const wells=[[hx,hy,26],[love.x,love.y,20],[tx,ty,24]];
  for(const G of gyres)wells.push([G.x,G.y,30*G.scale]);
  for(const st of stars){
    if(st.vx===undefined){st.vx=rand(-0.12,0.12);st.vy=rand(-0.12,0.12);st.mass=rand(0.7,1.3);}
    for(const w of wells){
      const dx=w[0]-st.x, dy=w[1]-st.y, d2=dx*dx+dy*dy;
      if(d2>1e6||d2<4)continue;
      const d=Math.sqrt(d2), f=w[2]*0.010/Math.max(d2,900);
      st.vx+=dx/d*f*st.mass; st.vy+=dy/d*f*st.mass;
    }
    const _m=mo(); st.x+=st.vx*_m; st.y+=st.vy*_m;
    st.vx*=0.9995; st.vy*=0.9995;
    const sp=Math.hypot(st.vx,st.vy);
    if(sp>1.4){st.vx*=1.4/sp;st.vy*=1.4/sp;}
    /* the field has no edge either: what leaves one side returns on the other */
    if(st.x<-8)st.x+=W+16; else if(st.x>W+8)st.x-=W+16;
    if(st.y<-8)st.y+=H+16; else if(st.y>H+8)st.y-=H+16;
  }
}
function drawStars(){
  { const [shx,shy]=pHeart(), [stx,sty]=pTemple(), [spx,spy]=pPower();
    drawStarstruck(shx,shy,stx,sty,spx,spy); }
  for(const st of stars){
    const tw=0.45+0.55*Math.sin(tick*st.sp+st.ph);
    /* a big star twinkles less: atmosphere scintillates a point, not a disc */
    const st_tw=1-(1-tw)*Math.min(1,1.15/(0.5+st.sz));
    X.fillStyle='rgba(255,238,140,'+(0.85*st_tw)+')';
    X.beginPath(); X.arc(st.x,st.y,st.sz*st_tw+0.2,0,TAU); X.fill();
    if(st.sz>0.85&&tw>0.55){
      /* a bright star swells rather than sprouting spikes: the cross is a
         camera artifact, not something a light does. */
      X.save(); X.globalCompositeOperation='lighter';
      const hr=st.sz*3.1+1.6;
      let hg=X.createRadialGradient(st.x,st.y,0,st.x,st.y,hr);
      hg.addColorStop(0,'rgba(255,246,190,'+(0.30*st_tw*Math.min(1,st.sz))+')');
      hg.addColorStop(0.45,'rgba(255,232,150,'+(0.10*st_tw)+')');
      hg.addColorStop(1,'rgba(255,220,120,0)');
      X.fillStyle=hg; X.beginPath(); X.arc(st.x,st.y,hr,0,TAU); X.fill();
      X.restore();
    }
  }
}

/* ============ main ============ */
X.save();X.setTransform(1,0,0,1,0,0);X.fillStyle='#000';X.fillRect(0,0,VW,VH);X.restore();
function frame(){
  tick++;
  X.save();X.setTransform(1,0,0,1,0,0);
  X.fillStyle='rgba(0,0,0,0.16)';X.fillRect(0,0,VW,VH);X.restore();
  X.setTransform(viewScale,0,0,viewScale,viewDx,viewDy);
  /* the record is held at backing resolution and presented at world size */
  X.imageSmoothingQuality='high';
  X.drawImage(P,0,0,bakeW,bakeH,0,0,W,H);
  SX.globalCompositeOperation='destination-out';
  SX.fillStyle='rgba(0,0,0,0.065)'; SX.fillRect(0,0,W,H);
  SX.globalCompositeOperation='source-over';
  X.save(); X.globalAlpha=0.30; X.drawImage(S,0,0,bakeW,bakeH,0,0,W,H); X.restore();
  let [hx,hy]=pHeart(); const [tx,ty]=pTemple(), [px,py]=pPower();
  if(meetT>0){
    /* pilgrimage: for a while, the self walks the law's ground */
    meetT-=Math.max(1,Math.round(pace*0.5));if(meetT<0)meetT=0;
    const mk=Math.min(1,(1100-meetT)/140)*Math.min(1,meetT/140)*0.85;
    const ma=tick*0.0012;
    hx=lerp(hx,tx+Math.cos(ma)*150,mk);
    hy=lerp(hy,ty+Math.sin(ma)*150,mk);
  }

  tPos.x=tx; tPos.y=ty;
  updateHeart(hx,hy);
  updateLove([[hx,hy],[tx,ty],[px,py]]);
  updateRefraction();
  updateTemple(tx,ty);
  updateGyres(px,py);
  updateStars(hx,hy,tx,ty);
  growLoveSkirt(tx,ty);

  drawStars();
  drawTemple(tx,ty);
  drawRefraction();
  drawGyres();
  drawHeart(hx,hy);
  contacts(hx,hy,tx,ty);
  heartTempleSeam(hx,hy,tx,ty);
  updateGoddessJudgment(tx,ty);
  updateSkirtRain();
  /* the derived and the displaced draw above the bodies that produced them:
     magenta is a relation between red and blue, and the glints are heat that
     has already left the ice. neither is a body, so neither is occluded. */
  updateMagentas();
  updateGlints();
  attSmooth=lerp(attSmooth,attendance,0.05);
  updateStarfall(hx,hy,tx,ty);
  drawLove();
  /* the arrivals stand above all of it */
  updateBride(tx,ty);
  updateAggressor(tx,ty);

  if(tick%45===0){
    document.getElementById('tally').innerHTML =
      '<span style="color:#68f">law '+temple.pts.length+'</span><br>'+
      '<span style="color:#4dd">ice '+temple.iceCount+'</span><br>'+
      '<span style="color:#f74">vess '+embers.filter(e=>e.kind!=='star').length+'</span><br>'+
      '<span style="color:#fd6">ahika '+embers.filter(e=>e.kind==='star').length+'</span><br>'+
      '<span style="color:#d5d">gyres '+gyres.length+'</span><br>'+
      '<span style="color:#d66">hearts '+(daughters.length+1)+'</span><br>'+
      '<span style="color:#ca2">stars '+stars.length+'</span>'+
      /* the arrivals are listed only while they stand. no count follows them:
         there is either one of her or there is not. */
      (bride.on ? '<br>'+ARRIVAL_NAMES.bride.label : '')+
      (aggressor.on ? '<br>'+ARRIVAL_NAMES.aggressor.label : '');
  }
}

function hash32(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return h>>>0;}
function seededRandom(){
  let a=rngState|0;a=(a+0x6D2B79F5)|0;rngState=a>>>0;
  let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return((t^(t>>>14))>>>0)/4294967296;

function randomSeed(){
  if(typeof crypto!=='undefined'&&crypto.getRandomValues){
    const a=new Uint32Array(2);crypto.getRandomValues(a);return a[0].toString(36)+a[1].toString(36);
  }

}

/* ============ CARRYING A WORLD FORWARD ============
   A world must open in a build that did not exist when it was written. Two
   things make that work and both are here:

   1. MIGRATION. Every field a newer build expects is filled in if the save
      predates it, and every field a newer build no longer knows about is
      simply ignored. A save is a set of claims about a world, not a memory
      dump, and a claim the reader does not recognise is not an error.

   2. NO VERSION GATE. There is deliberately no "this save is too old" check.
      If a save can be read at all it is read, and whatever is missing is
      defaulted. A world you spent six hours on must never be refused.

   Note on where saves live: for pages opened from a file:// path, browsers
   give EACH FILE its own separate localStorage. That is undefined behaviour
   in the standard and every current browser does it this way, so a world
   autosaved by one leaf_*.html can never be seen by another one, no matter
   what key it is stored under. It is not a bug and no key fixes it. Carrying
   a world between builds therefore goes through a FILE -- see the drop
   handler below -- or the whole thing is served from one origin instead. */
function migrateWorld(d){
  if(!d||typeof d!=='object')return d;
  d.tick=d.tick||0;
  d.love=d.love||{}; if(d.love.guard===undefined)d.love.guard=0;
  d.bride=d.bride||{}; if(d.bride.forced===undefined)d.bride.forced=0;
  d.aggressor=d.aggressor||{};
  if(d.aggressor.forced===undefined)d.aggressor.forced=0;
  if(!Array.isArray(d.aggressor.cuts))d.aggressor.cuts=[];
  /* stars written before mass was a spectrum carry no sz worth trusting */
  if(Array.isArray(d.stars))for(const st of d.stars){
    if(typeof st.sz!=='number'||!isFinite(st.sz))st.sz=starSize();
    if(typeof st.mass!=='number'||!isFinite(st.mass))st.mass=0.5+st.sz*0.9;
  }
  if(!Array.isArray(d.fallers))d.fallers=[];
  return d;
}
function restore(json){
  try{
    const d=migrateWorld(JSON.parse(json));
    if(d.world&&d.world.w&&d.world.h)adoptLogicalWorld(d.world.w,d.world.h);
    if(Object.prototype.hasOwnProperty.call(d,'seed'))applySeed(d.seed,d.rngState);
    tick=d.tick||0;
    const ts=d.temple||{},hs=d.heart||{},rs=d.relations||{},fx=d.effects||{};
    temple.pts.length=0; for(const p of ts.pts||d.pts||[])temple.pts.push(p);
    temple.nextAt=ts.nextAt||0;temple.iceCount=ts.iceCount||0;temple.shock=ts.shock||0;
    heart.rings.length=0;for(const r of hs.rings||[])heart.rings.push(r);
    heart.sparks.length=0;for(const s of hs.sparks||[])heart.sparks.push(s);
    heart.skirt.length=0;for(const n of hs.skirt||d.heartSkirt||[])heart.skirt.push(n);
    heart.shock=hs.shock||0;
    if(d.love){
      love.x=d.love.x||0;love.y=d.love.y||0;love.init=!!d.love.init;
      love.gazeA=d.love.gazeA||0;love.gazeTarget=d.love.gazeTarget||0;
      love.hitVx=d.love.hitVx||0;love.hitVy=d.love.hitVy||0;
      love.shock=d.love.shock||0;love.stun=d.love.stun||0;love.shatter=d.love.shatter||null;love.guard=d.love.guard||0;
    }else{
      love.init=false;love.hitVx=0;love.hitVy=0;love.shock=0;love.stun=0;love.shatter=null;
    }
    gyres.length=0;
    for(const g of d.gyres||[{x:0,y:0,scale:1,root:true,energy:1,age:0,life:1e9}]){
      const G2=makeGyre(g.x,g.y,g.scale,g.root);
      G2.energy=g.energy==null?1:g.energy;G2.shock=g.shock||0;G2.age=g.age||0;G2.life=g.life||G2.life;
      G2.petrify=g.petrify||0;
      if(Array.isArray(g.orbiters))G2.orbiters=g.orbiters.map(o=>({...o,trail:o.trail||[]}));
      if(Array.isArray(g.out))G2.out=g.out;

    ferments.length=0;for(const f of d.ferments||[])ferments.push(f);
    /* Legacy stars were fixed points pinned near a ceiling. Give them the
       motion they always should have had, without moving them. */
    stars.length=0;
    for(const s of d.stars||[]){
      if(s.vx===undefined){s.vx=rand(-0.12,0.12);s.vy=rand(-0.12,0.12);}
      if(s.mass===undefined)s.mass=rand(0.7,1.3);

    /* A save written before the fall became ballistic holds fallers with no
       position or velocity at all. Rehydrate rather than trust, or the first
       restored session fills with NaN. */
    fallers.length=0;
    for(const f of d.fallers||[]){
      if(f.x===undefined){f.x=f.sx||0;f.y=f.sy||0;}
      if(f.vx===undefined){f.vx=0;f.vy=0;}
      if(f.px===undefined){f.px=f.x;f.py=f.y;}
      if(f.d0===undefined)f.d0=Math.max(1,Math.hypot((f.tx||0)-f.x,(f.ty||0)-f.y));

      const e=d.embers[i],kind=e.kind||'ember';
      const kept={...e,kind,scale:e.scale||rand(0.88,1.12),skirt:e.skirt||[]};
      embers.push(kept);
    }
    skirtRain.length=0;for(const r of d.skirtRain||[])skirtRain.push(r);
    starBursts.length=0;for(const b of fx.starBursts||[])starBursts.push(b);
    elementFragments.length=0;for(const f of fx.elementFragments||[])elementFragments.push(f);
    elementFlashes.length=0;for(const f of fx.elementFlashes||[])elementFlashes.push(f);
    seamBursts.length=0;for(const b of fx.seamBursts||[])seamBursts.push(b);
    attendance=rs.attendance||0;attSmooth=rs.attSmooth||0;bondSeen=rs.bondSeen||0;bondAlone=rs.bondAlone||0;meetT=rs.meetT||0;
    attendHue=rs.attendHue==null?null:rs.attendHue;if(typeof rs.sndOn==='boolean')sndOn=rs.sndOn;
    if(Number.isFinite(rs.pace))pace=Math.max(0.1,Math.min(500,rs.pace));

    const bsv=d.bride||{};
    bride.on=!!bsv.on;bride.x=bsv.x||0;bride.y=bsv.y||0;
    bride.t=bsv.t||0;bride.cool=bsv.cool||0;

    aggressor.t=agv.t||0;aggressor.cool=agv.cool||0;
    aggressor.vx=agv.vx||0;aggressor.vy=agv.vy||0;
    aggressor.target=(agv.target>=0&&gyres[agv.target])?gyres[agv.target]:null;
    if(d.bake&&d.bake.w&&d.bake.h){ensureBacking(d.bake.w,d.bake.h);syncBakeTransform();}
    if(d.petrifying&&gyres[d.petrifying.gyre]&&embers[d.petrifying.goddess])
      petrifying={G:gyres[d.petrifying.gyre],gd:embers[d.petrifying.goddess],t:d.petrifying.t||0};
    /* Reconstruction may consume randomness for legacy defaults. A schema-3
       checkpoint resumes at the exact next chance event it originally had. */
    if(Number.isFinite(d.rngState))rngState=d.rngState>>>0;
    const restoreLayer=(src,ctx,canvas,legacy)=>{
      ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();

        if(legacy&&!d.world&&img.naturalWidth&&img.naturalHeight)adoptLogicalWorld(img.naturalWidth,img.naturalHeight);

           own resolution: grow the backing store to hold it rather than
           downsampling it to fit a small window. */
        if(img.naturalWidth>bakeW||img.naturalHeight>bakeH){
          ensureBacking(img.naturalWidth,img.naturalHeight);

        ctx.drawImage(img,0,0,img.naturalWidth,img.naturalHeight,0,0,bakeW,bakeH);

}
/* Older saves may already contain the stationary pale rings removed above.
   They were flattened into the history bitmap, so erase only their two exact
   blue-grey pigments; green traces, cyan gems, scars, and stains are outside
   this deliberately narrow color test. */
function removeLegacyFossilResidue(){
  try{
    const im=PX.getImageData(0,0,P.width,P.height),d=im.data;
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];
      if(a>10&&r>=142&&r<=182&&g-r>=22&&g-r<=36&&b-g>=28&&b-g<=42)d[i+3]=0;
    }
    PX.putImageData(im,0,0);
  }catch(e){}
}
let noticeTimer=0;
function notice(text){
  let n=document.getElementById('worldNotice');
  if(!n){n=document.createElement('div');n.id='worldNotice';n.style.cssText='position:fixed;left:13px;bottom:14px;z-index:12;font:10px "Courier New",monospace;letter-spacing:.4px;color:#c86868;pointer-events:none;opacity:0;transition:opacity .3s';document.body.appendChild(n);}
  n.textContent=text;n.style.opacity='0.85';
  clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{n.style.opacity='0';},2000);
}
function safeWorldName(){
  return (seedName||'unnamed').replace(/[^a-z0-9_-]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,48)||'unnamed';
}
function download(text,name,mime){
  const url=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportWorld(){
  try{ download(snapshot(),'leaf-'+safeWorldName()+'.json','application/json'); }
  catch(e){notice('save failed');}
}
/* `keep` writes the running page back out with the world written INTO it, so
   the result is one file that opens straight into this cosmos with no import
   step at all. It is the whole thing -- engine and world together -- and it is
   also what to hand a future build: drop it on the new one and the world
   comes across while the engine stays new. */
function keepWorld(){
  try{
    const doc=document.documentElement.outerHTML;
    const world=snapshot();
    const tag='<script id="leaf-world" type="application/json">'+
      world.replace(/<\//g,'<\\/')+'<\/script>';
    const stripped=doc.replace(/<script id="leaf-world"[\s\S]*?<\/script>/,'');
    const outHtml='<!DOCTYPE html>\n'+stripped.replace('</head>',tag+'</head>');
    download(outHtml,'leaf-'+safeWorldName()+'.html','text/html');
  }catch(e){ notice('keep failed'); }
}
/* if this page was written out with a world in it, that world IS the world */
function embeddedWorld(){
  const el=document.getElementById('leaf-world');
  return el&&el.textContent&&el.textContent.trim().length>2?el.textContent:null;
}
function loadFromText(text){
  const data=JSON.parse(text);
  if(!data||typeof data!=='object'||!('tick' in data))throw new Error('invalid world');
  resetWorld();
  if(!restore(text))throw new Error('restore failed');
  try{localStorage.setItem(SAVE_KEY,text);}catch(e){}
  lineage=true;
}
/* ============ DROP A WORLD ON THE WINDOW ============
   Drag a leaf-*.json onto the page and it opens. That is the whole gesture --
   no dialog, no file picker, no import screen. It is how a world moves from
   one build to the next: keep the json, drop it on whatever you are running
   now. Dropping is also how you recover a world from a build you have since
   replaced, so the json is worth keeping somewhere permanent. */
addEventListener('dragover',e=>{ e.preventDefault(); dropHint(true); });
addEventListener('dragleave',e=>{ if(e.clientX<=0||e.clientY<=0)dropHint(false); });
addEventListener('drop',async e=>{
  e.preventDefault(); dropHint(false);
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(!f)return;
  try{
    const text=await f.text();
    /* a json world, or an html build with a world written into it */
    const m=/<script id="leaf-world" type="application\/json">([\s\S]*?)<\/script>/.exec(text);
    loadFromText(m?m[1]:text);
    notice('world opened');
  }catch(err){ notice('not a world'); }
});
let _dropEl=null;
function dropHint(on){
  if(!_dropEl){
    _dropEl=document.createElement('div');
    _dropEl.style.cssText='position:fixed;inset:0;z-index:30;display:none;'+
      'border:1px solid rgba(0,200,255,0.5);background:rgba(0,40,60,0.14);'+
      'pointer-events:none';
    document.body.appendChild(_dropEl);
  }
  _dropEl.style.display=on?'block':'none';
}

function chooseWorldImport(){
  const input=document.createElement('input');input.type='file';input.accept='.json,.html,application/json,text/html';
  input.addEventListener('change',async()=>{
    try{if(input.files&&input.files[0])loadFromText(await input.files[0].text());}
    catch(e){notice('load failed');}
  },{once:true});
  input.click();
}
/* Full-fidelity checkpoints include two PNG layers and live trail histories.
   Saving them synchronously every few seconds would itself disturb the world. */
setInterval(()=>{guardedSave();},30000);
addEventListener('beforeunload',()=>{guardedSave();releaseLock();});

/* one writer at a time: tabs take a heartbeat lock; only the holder saves.
   a tab that isn't the save's own lineage never overwrites a far more developed world. */
const LOCK_KEY=SAVE_KEY+'_lock';
const TAB_ID=Math.random().toString(36).slice(2);
let lockOwner=false, lineage=false;
function heartbeat(){
  try{
    const l=JSON.parse(localStorage.getItem(LOCK_KEY)||'null');
    const now=Date.now();
    if(!l||now-l.t>6500||l.id===TAB_ID){
      localStorage.setItem(LOCK_KEY,JSON.stringify({id:TAB_ID,t:now}));
      lockOwner=true;
    } else lockOwner=false;
  }catch(e){lockOwner=true;}
}
function releaseLock(){
  try{
    const l=JSON.parse(localStorage.getItem(LOCK_KEY)||'null');
    if(l&&l.id===TAB_ID)localStorage.removeItem(LOCK_KEY);
  }catch(e){}
}
setInterval(heartbeat,2500); heartbeat();
let localSaveHealthy=true;
function guardedSave(){
  if(!lockOwner)return;
  try{
    if(!lineage){
      const ex=localStorage.getItem(SAVE_KEY);
      if(ex){
        const d=JSON.parse(ex);
        if((d.tick||0)>tick+1500)return; /* an elder world lives in the slot; do not stomp it */
      }
    }
    localStorage.setItem(SAVE_KEY,snapshot());
    lineage=true;localSaveHealthy=true;
  }catch(e){
    if(localSaveHealthy)notice('autosave full · save to file');
    localSaveHealthy=false;
  }
}
function resetWithSeed(name){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  applySeed(name);resetWorld();lineage=true;guardedSave();
}
function resetWithRandomSeed(){resetWithSeed(randomSeed());}

/* ============ help, and the dev summons ============
   The command list used to live in the input's placeholder, where it was both
   clipped by a 280px field and hidden behind the pre-filled value. It is a
   panel now: ` opens the prompt, `help` opens the words, escape closes either.
   Nothing is listed in the field by default -- the prompt should look like a
   prompt, not like a menu.

   SUMMON is a development instrument and nothing else. It is the answer to
   "ahika are so rare I have never seen one": `summon ahika` puts one in the
   lattice immediately so its sprite can be looked at and its behaviour tested.
   When the terminal is replaced by spells, this goes with it. */
/* The words, and nothing else. No glosses, no headings, no frame -- a menu
   here should be as close to absent as a menu can be. Click anywhere to
   dismiss it. Each word is coloured by what it acts on. */
/* WORDS, NOT CODES. The two-letter forms were short and unreadable, which is
   the wrong trade -- a word you cannot remember is not fast. These are the
   real words; every short form still works silently for anyone who wants it,
   but nothing here has to be decoded. */
const HELP_LINES=[
  ['seed','#68f'],['reset','#68f'],['save','#68f'],['keep','#68f'],['load','#68f'],
  ['pace','#d5d'],['fall','#ca2'],['meet','#d66'],['attend','#4dd'],['hush','#7a8496'],
  ['zettaitsune','#0f0'],['aggression','#f74'],
  ['ahika','#fd6'],['star','#ca2'],['stars','#ca2'],['gyre','#d5d'],
];
const helpBox=document.createElement('div');
helpBox.style.cssText='position:fixed;left:12px;bottom:38px;display:none;z-index:11;'+
 'font-family:"Courier New",monospace;font-size:11px;line-height:1.9;'+
 'letter-spacing:1px;opacity:0.72;pointer-events:none';
document.body.appendChild(helpBox);
function showHelp(){
  helpBox.innerHTML=HELP_LINES.map(([c,col])=>
    '<div style="color:'+col+'">'+c+'</div>').join('');
  helpBox.style.display='block';
}
function hideHelp(){ helpBox.style.display='none'; }
/* anywhere at all */
addEventListener('pointerdown',()=>{ if(helpBox.style.display!=='none')hideHelp(); });
/* Bare words. There is no reason to type `summon` in front of a noun -- the
   noun IS the instruction. Short as they go: two or three letters each, the
   long forms kept only so old habits still land. */
function summon(what){
  const [tx0,ty0]=pTemple();
  if(what==='ahk'||what==='ahika'||what==='kept'){
    const seat=chooseKeptSeat(false);
    embers.push({x:seat.x,y:seat.y,ph:rand(0,TAU),kind:'star',scale:1,skirt:[]});
    addElementImpact('star',tx0+seat.x,ty0+seat.y,0.9); sfx('ahika');
    notice('kept light');
  } else if(what==='st'||what==='star'||what==='sts'||what==='stars'){
    const n=(what==='sts'||what==='stars')?40:1;
    for(let k=0;k<n;k++)stars.push(makeStar(rand(W*0.1,W*0.9),rand(H*0.1,H*0.9),0,0));
  } else if(what==='gy'||what==='gyre'){
    /* SMALL, and mortal. It was inheriting the root's scale, which is why two
       enormous turnings appeared and stayed. Nothing summoned is permanent. */
    gyres.push(makeGyre(rand(W*0.2,W*0.8),rand(H*0.2,H*0.8),rand(0.28,0.46),false));
  } else if(what==='zettaitsune'||what==='zts'||what==='bride'){
    bride.on=true;bride.t=0.01;bride.age=0;bride.dying=0;bride.cool=0;
    bride.life=Math.max(TUNE.ARRIVAL_MIN_LIFE,slow(rand(TUNE.BRIDE_LIFE[0],TUNE.BRIDE_LIFE[1])));
    bride.x=love.x;bride.y=love.y;bride.forced=dur(4200);sfx('goddess');
  } else if(what==='aggression'||what==='agr'||what==='aggressor'){
    aggressor.on=true;aggressor.t=0.01;aggressor.age=0;aggressor.dying=0;aggressor.cool=0;
    aggressor.x=rand(W*0.3,W*0.7);aggressor.y=rand(H*0.3,H*0.7);
    aggressor.life=Math.max(TUNE.ARRIVAL_MIN_LIFE,slow(rand(TUNE.AGGR_LIFE[0],TUNE.AGGR_LIFE[1])));
    aggressor.forced=dur(4200);
    sfx('goddess');
  }
}

const SUMMON_WORDS=new Set([
  'ahika','star','stars','gyre','zettaitsune','aggression',
  /* short forms, kept but never advertised */
  'ahk','kept','st','sts','gy','zts','bride','agr','aggressor']);
/* the terminal: press ` to open. type h for the words. */
const term=document.createElement('input');
term.id='seedterm';
term.placeholder='help';
term.style.cssText='position:fixed;bottom:10px;left:12px;width:280px;background:rgba(0,0,0,0.7);'+
 'border:1px solid #26304a;color:#9fb8d8;font-family:"Courier New",monospace;font-size:11px;'+
 'padding:5px 8px;border-radius:3px;outline:none;display:none;z-index:9';
document.body.appendChild(term);
addEventListener('keydown',e=>{
  if(e.key==='`'){
    e.preventDefault();
    term.style.display=term.style.display==='none'?'block':'none';
    /* It used to open with `seed <name>` sitting in the VALUE, which had to be
       deleted before anything could be typed, and which also hid the
       placeholder -- so `help` wrote its command list into a placeholder that
       could never be seen. The current seed belongs in the prompt, not in the
       field. */
    if(term.style.display==='block'){
      term.value='';
      term.placeholder=seedName?('· '+seedName+' ·  help'):'help';
      term.focus();
    }
    else term.blur();
  } else if(e.key==='Enter'&&document.activeElement===term){
    const v=term.value.trim();
    const named=/^(?:sd|seed)\s+(.+)$/i.exec(v);
    if(v==='rs'||v==='reset')resetWithRandomSeed();
    else if(named&&named[1].trim())resetWithSeed(named[1].trim());
    else if(v==='sv'||v==='save')exportWorld();
    else if(v==='keep')keepWorld();
    else if(v==='ld'||v==='load')chooseWorldImport();
    else if(v==='f'||v==='fall'){ launchFall(); }
    else if(v==='mt'||v==='meet'){ meetT=1100; }
    else if(v==='at'||v==='attend'){ toggleWheel(); }
    else if(v==='hs'||v==='hush'){ sndOn=!sndOn; }
    else if(/^(p|pace|speed)\b/i.test(v)){
      /* pace <n> — compress elapsed time for the slow developments only.
         `pace` alone reports where it stands; `pace 1` returns to true idle. */
      const m2=/^(?:p|pace|speed)\s+([0-9]*\.?[0-9]+)$/i.exec(v);
      if(m2){
        pace=Math.max(0.1,Math.min(20000,parseFloat(m2[1])));
        notice('pace '+pace);
      } else notice('pace '+pace);
    }
    else if(v==='h'||v==='help'||v==='?'){ showHelp(); }
    else if(/^summon\b/i.test(v)){ summon(v.replace(/^summon\s*/i,'').trim()); }
    else if(SUMMON_WORDS.has(v)){ summon(v); }
    /* AN UNKNOWN WORD DOES NOTHING. It used to fall through to
       applySeed(v)+resetWorld(), so a typo, or any noun the parser did not
       recognise, silently destroyed the world and reseeded it under that
       name. Nothing here may reset except by asking to. */
    else if(v){ notice('?'); }
    term.style.display='none';term.blur();
  } else if(e.key==='Escape'){
    hideHelp();
    if(document.activeElement===term){term.style.display='none';term.blur();}
  } else if(e.key==='c'&&document.activeElement!==term){
    toggleWheel();
  }
});

/* ============ the attendant ============
   the first hand offered to the player: a ring of color. choose a hue and
   LOVE attends what wears it — red the fires, gold the rising light, blue
   the law, magenta the turning. green asks her to rest, gazing free.
   the center releases her. press c, or tell the terminal: attend. */
let attendHue=null, wheelOpen=false;
const wheel=document.createElement('canvas');
wheel.width=wheel.height=84;
wheel.style.cssText='position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:84px;height:84px;'+
 'border-radius:50%;display:none;z-index:9;cursor:pointer;opacity:0.88';
document.body.appendChild(wheel);
function drawWheel(){
  const wx=wheel.getContext('2d'); wx.clearRect(0,0,84,84);
  for(let a=0;a<360;a+=3){
    wx.beginPath(); wx.strokeStyle='hsl('+a+',85%,55%)'; wx.lineWidth=10;
    wx.arc(42,42,32,(a-90)*Math.PI/180,(a-86.8)*Math.PI/180); wx.stroke();
  }
  wx.fillStyle='rgba(0,0,0,0.78)'; wx.beginPath(); wx.arc(42,42,22,0,TAU); wx.fill();
  wx.font='8px "Courier New"'; wx.textAlign='center';
  if(attendHue!=null){
    const ar=(attendHue-90)*Math.PI/180;
    wx.fillStyle='hsl('+attendHue+',90%,65%)';
    wx.beginPath(); wx.arc(42+Math.cos(ar)*32,42+Math.sin(ar)*32,5,0,TAU); wx.fill();
    wx.fillStyle='rgba(255,255,255,0.8)';
    wx.fillText(Math.round(attendHue)+'°',42,45);
  } else {
    wx.fillStyle='rgba(255,255,255,0.45)';
    wx.fillText('attend',42,45);
  }
}
wheel.addEventListener('click',ev=>{
  const r=wheel.getBoundingClientRect();
  const dx=ev.clientX-(r.left+r.width/2), dy=ev.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)*(84/r.width)<22) attendHue=null; /* the center releases her */
  else attendHue=((Math.atan2(dy,dx)*180/Math.PI)+90+360)%360;
  drawWheel();
});
function toggleWheel(){
  wheelOpen=!wheelOpen;
  wheel.style.display=wheelOpen?'block':'none';
  if(wheelOpen)drawWheel();
}
/* ============ the seed is lore ============
   a named world differs in its bones: how fast the heart gives, how large
   the rot turns, how wide the law spaces its nodes, how restless the gaze. */
let lore={beat:120,gyreScale:1,lattice:17,sweep:1};
function applyLore(){
  const h=hash32(seedName||'the-four-motions');
  lore.beat=104+(h%33);
  lore.gyreScale=0.9+((h>>>5)%26)/100;
  lore.lattice=15+((h>>>10)%4); /* 15–18: must stay under the bond threshold */
  lore.sweep=0.8+((h>>>15)%50)/100;
  const phase=(name)=>hash32((seedName||'the-four-motions')+'|'+name)/4294967296*TAU;
  pathPhases={heart:phase('heart'),love:phase('love'),temple:phase('temple'),power:phase('power')};
}
applyLore();
let restored=false;
/* A world written into this page wins over anything autosaved, because it was
   put here on purpose. Otherwise the per-file autosave, if this file has one.
   If neither exists the world begins -- and a world from another build can be
   dropped onto the window at any time. */
try{
  const emb=embeddedWorld();
  if(emb){ restored=restore(emb); if(restored)lineage=true; }
}catch(e){}
try{
  if(!restored){const s=localStorage.getItem(SAVE_KEY);if(s){restored=restore(s);if(restored)lineage=true;}}
}catch(e){}
if(!restored)applySeed('');
worldReady=true;

/* requestAnimationFrame stops when a tab is hidden. A worker supplies the
   background pulse; visible rendering still uses the native animation clock. */
let rafId=0, inFrame=false, backgroundClock=null, fallbackClock=0;
function runFrame(){
  if(inFrame)return;
  inFrame=true;
  try{frame();}finally{inFrame=false;}
  if(!document.hidden)rafId=requestAnimationFrame(runFrame);
}
try{
  const src='setInterval(function(){postMessage(0)},33)';
  const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
  backgroundClock=new Worker(url); URL.revokeObjectURL(url);
  backgroundClock.onmessage=()=>{if(document.hidden)runFrame();};
}catch(e){
  fallbackClock=setInterval(()=>{if(document.hidden)runFrame();},33);
}
addEventListener('visibilitychange',()=>{
  if(document.hidden)cancelAnimationFrame(rafId);
  else {cancelAnimationFrame(rafId);rafId=requestAnimationFrame(runFrame);}
});
rafId=requestAnimationFrame(runFrame);
</script>
